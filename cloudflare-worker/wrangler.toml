name = "dais-chat"
main = "worker.js"
# account_id is set via CLOUDFLARE_ACCOUNT_ID env var / GitHub secret — not stored here
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
KNOWLEDGE_BASE_URL = "https://raw.githubusercontent.com/alifrazkhan92/dataaischoolwebsite/main/ai-knowledge-base.txt"
ALLOWED_ORIGIN     = "https://www.dataaischool.com"
# Change this to any ElevenLabs voice ID you prefer (see elevenlabs.io/voice-library)
ELEVENLABS_VOICE_ID = "Xb7hH8MSUJpSbSDYk0k2"  # Alice — British female, works on free plan

# Secrets (set via wrangler secret put — never stored here):
#   ANTHROPIC_API_KEY    — Anthropic API key
#   ELEVENLABS_API_KEY   — ElevenLabs API key
#   ADMIN_KEY            — password to view conversation logs

# SEC-003 note: the database_id below is in this public repository.
# The ID alone does not grant data access (a scoped Cloudflare API token is also required),
# but it reduces obscurity. Ensure the Cloudflare API token used in CI is scoped
# to Workers deploy only and does NOT have D1 read/write permissions.
[[d1_databases]]
binding       = "dais_chat_logs"
database_name = "dais-chat-logs"
database_id   = "e89bb081-fdd2-44e3-b8b2-a735d1eaf687"
