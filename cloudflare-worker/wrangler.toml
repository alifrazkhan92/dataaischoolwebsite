name = "dais-chat"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
KNOWLEDGE_BASE_URL = "https://raw.githubusercontent.com/alifrazkhan92/dataaischoolwebsite/main/ai-knowledge-base.txt"
ALLOWED_ORIGIN     = "https://www.dataaischool.com"
# Change this to any ElevenLabs voice ID you prefer (see elevenlabs.io/voice-library)
ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"

# Secrets (set via wrangler secret put — never stored here):
#   ANTHROPIC_API_KEY    — Anthropic API key
#   ELEVENLABS_API_KEY   — ElevenLabs API key
#   ADMIN_KEY            — password to view conversation logs

[[d1_databases]]
binding       = "dais_chat_logs"
database_name = "dais-chat-logs"
database_id   = "e89bb081-fdd2-44e3-b8b2-a735d1eaf687"
