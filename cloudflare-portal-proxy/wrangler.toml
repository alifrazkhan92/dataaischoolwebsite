name = "dais-portal-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Cutover: the whole public site now runs on the Django origin, so all of www is
# proxied there. To roll back, restore wrangler.toml.pre-cutover.bak and redeploy.
routes = [
  { pattern = "www.dataaischool.com/*", zone_name = "dataaischool.com" }
]
