<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#gold)"/>

  <!-- Central orchestrator agent -->
  <g transform="translate(280, 140)">
    <circle cx="70" cy="70" r="58" fill="#112038" stroke="#C89930" stroke-width="3"/>
    <circle cx="70" cy="70" r="48" fill="#0D1E35"/>
    <!-- Robot face -->
    <rect x="44" y="48" width="52" height="38" rx="8" fill="#1A3A6A"/>
    <rect x="50" y="54" width="16" height="10" rx="3" fill="#C89930"/>
    <rect x="74" y="54" width="16" height="10" rx="3" fill="#C89930"/>
    <rect x="52" y="72" width="36" height="6" rx="3" fill="#2A4A6A"/>
    <!-- Antenna -->
    <line x1="70" y1="22" x2="70" y2="10" stroke="#C89930" stroke-width="2"/>
    <circle cx="70" cy="8" r="4" fill="#E8B030"/>
    <!-- Label -->
    <text x="70" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#C89930">Orchestrator</text>
    <text x="70" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">Main Agent</text>
  </g>

  <!-- Tool nodes around the orchestrator -->
  <!-- Tool 1: Web Search (top) -->
  <g transform="translate(350, 40)">
    <circle cx="30" cy="30" r="28" fill="#112038" stroke="#1E3A5E" stroke-width="1.5"/>
    <text x="30" y="22" text-anchor="middle" font-family="monospace" font-size="18" fill="#6B8FAE">🔍</text>
    <text x="30" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Search</text>
    <text x="30" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Tool</text>
  </g>
  <line x1="350" y1="95" x2="380" y2="155" stroke="#C89930" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Tool 2: Code execution (right) -->
  <g transform="translate(500, 170)">
    <circle cx="30" cy="30" r="28" fill="#112038" stroke="#1E3A5E" stroke-width="1.5"/>
    <text x="30" y="24" text-anchor="middle" font-family="monospace" font-size="14" fill="#E8B030">&lt;/&gt;</text>
    <text x="30" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Code</text>
    <text x="30" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Executor</text>
  </g>
  <line x1="498" y1="200" x2="440" y2="210" stroke="#C89930" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Tool 3: Database (bottom right) -->
  <g transform="translate(460, 300)">
    <circle cx="30" cy="30" r="28" fill="#112038" stroke="#1E3A5E" stroke-width="1.5"/>
    <ellipse cx="30" cy="22" rx="14" ry="6" fill="#1A4A8A" stroke="#C89930" stroke-width="1"/>
    <rect x="16" y="22" width="28" height="18" fill="#1A3055"/>
    <ellipse cx="30" cy="40" rx="14" ry="6" fill="#1A3055" stroke="#C89930" stroke-width="1"/>
    <text x="30" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Vector</text>
    <text x="30" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Store</text>
  </g>
  <line x1="460" y1="305" x2="410" y2="270" stroke="#C89930" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Tool 4: API calls (bottom left) -->
  <g transform="translate(190, 300)">
    <circle cx="30" cy="30" r="28" fill="#112038" stroke="#1E3A5E" stroke-width="1.5"/>
    <text x="30" y="26" text-anchor="middle" font-family="monospace" font-size="11" fill="#C89930">API</text>
    <text x="30" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#6B8FAE">↔</text>
    <text x="30" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">External</text>
    <text x="30" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">APIs</text>
  </g>
  <line x1="248" y1="305" x2="290" y2="270" stroke="#C89930" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Tool 5: Memory (left) -->
  <g transform="translate(140, 170)">
    <circle cx="30" cy="30" r="28" fill="#112038" stroke="#1E3A5E" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="4" fill="#1A3A6A"/>
    <line x1="16" y1="25" x2="44" y2="25" stroke="#C89930" stroke-width="1" opacity="0.6"/>
    <line x1="16" y1="32" x2="44" y2="32" stroke="#C89930" stroke-width="1" opacity="0.6"/>
    <line x1="16" y1="39" x2="44" y2="39" stroke="#C89930" stroke-width="1" opacity="0.6"/>
    <text x="30" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Memory</text>
    <text x="30" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Store</text>
  </g>
  <line x1="200" y1="200" x2="280" y2="210" stroke="#C89930" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Sub-agent (top left) -->
  <g transform="translate(160, 40)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#112038" stroke="#1E3A5E" stroke-width="1.5"/>
    <circle cx="40" cy="22" r="10" fill="#1A4A8A"/>
    <text x="40" y="26" text-anchor="middle" font-family="monospace" font-size="8" fill="#C89930">AI</text>
    <text x="40" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8DA3BE">Sub-Agent</text>
  </g>
  <line x1="240" y1="70" x2="283" y2="160" stroke="#6B8FAE" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Right panel: description -->
  <g transform="translate(630, 60)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#C89930">Agentic Systems</text>
    <text x="0" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Build AI that plans &amp; acts</text>

    <rect x="0" y="36" width="220" height="1" fill="#1E3A5E"/>

    <g font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">
      <text x="0" y="58">▸ Agent architectures</text>
      <text x="0" y="76">▸ Tool use &amp; function calling</text>
      <text x="0" y="94">▸ Multi-step reasoning</text>
      <text x="0" y="112">▸ Orchestration frameworks</text>
      <text x="0" y="130">▸ Multi-agent systems</text>
      <text x="0" y="148">▸ Observability &amp; safety</text>
      <text x="0" y="166">▸ Evaluation &amp; reliability</text>
    </g>

    <!-- Loop arrow icon -->
    <g transform="translate(10, 195)">
      <path d="M0,30 Q0,0 30,0 Q60,0 60,30 Q60,60 30,60 Q15,60 5,50" fill="none" stroke="#C89930" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="0,42 0,58 14,50" fill="#C89930"/>
      <text x="30" y="35" text-anchor="middle" font-family="monospace" font-size="10" fill="#E8B030">Plan</text>
      <text x="30" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#E8B030">→ Act</text>
      <text x="30" y="61" text-anchor="middle" font-family="monospace" font-size="10" fill="#E8B030">→ Observe</text>
    </g>
  </g>

  <text x="450" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#C89930" letter-spacing="2">AGENTIC AI BOOTCAMP</text>
</svg>
