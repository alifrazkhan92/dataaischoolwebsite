<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E3268"/>
      <stop offset="100%" style="stop-color:#0A2240"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <!-- Subtle dots -->
  <g fill="#6B8FAE" opacity="0.12">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="160" cy="40" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="240" cy="40" r="2"/>
    <circle cx="280" cy="40" r="2"/><circle cx="320" cy="40" r="2"/><circle cx="360" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="360" cy="80" r="2"/>
    <circle cx="40" cy="120" r="2"/><circle cx="360" cy="120" r="2"/>
    <circle cx="40" cy="160" r="2"/><circle cx="80" cy="160" r="2"/><circle cx="320" cy="160" r="2"/><circle cx="360" cy="160" r="2"/>
  </g>

  <!-- Left person at laptop -->
  <g transform="translate(40, 60)">
    <!-- Desk -->
    <rect x="0" y="120" width="130" height="8" rx="2" fill="#1A3055"/>
    <rect x="10" y="128" width="8" height="40" fill="#142840"/>
    <rect x="112" y="128" width="8" height="40" fill="#142840"/>
    <!-- Laptop -->
    <rect x="10" y="60" width="110" height="62" rx="4" fill="#0D1E35"/>
    <rect x="16" y="66" width="98" height="50" rx="2" fill="#1A4A8A"/>
    <!-- Screen content - bar chart -->
    <rect x="24" y="96" width="12" height="14" fill="#C89930" opacity="0.8"/>
    <rect x="40" y="88" width="12" height="22" fill="#C89930" opacity="0.9"/>
    <rect x="56" y="80" width="12" height="30" fill="#E8B030"/>
    <rect x="72" y="90" width="12" height="20" fill="#C89930" opacity="0.7"/>
    <rect x="88" y="84" width="12" height="26" fill="#C89930" opacity="0.85"/>
    <!-- Keyboard -->
    <rect x="10" y="122" width="110" height="8" rx="2" fill="#0F2540"/>
    <!-- Person silhouette -->
    <circle cx="65" cy="35" r="18" fill="#1A4A8A"/>
    <ellipse cx="65" cy="80" rx="28" ry="22" fill="#1A3A60"/>
    <!-- Face details -->
    <circle cx="58" cy="33" r="2.5" fill="#6B8FAE"/>
    <circle cx="72" cy="33" r="2.5" fill="#6B8FAE"/>
    <path d="M60,42 Q65,47 70,42" fill="none" stroke="#6B8FAE" stroke-width="1.5"/>
  </g>

  <!-- Connection line / wifi signal in middle -->
  <g transform="translate(180, 85)" opacity="0.8">
    <path d="M0,35 Q20,10 40,35" fill="none" stroke="#C89930" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M8,35 Q20,18 32,35" fill="none" stroke="#C89930" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="20" cy="35" r="4" fill="#C89930"/>
    <!-- Video call icon -->
    <rect x="4" y="50" width="32" height="22" rx="3" fill="#1A3055" stroke="#C89930" stroke-width="1.5"/>
    <polygon points="36,56 46,61 36,66" fill="#C89930"/>
  </g>

  <!-- Right person at tablet -->
  <g transform="translate(230, 60)">
    <!-- Desk -->
    <rect x="0" y="120" width="130" height="8" rx="2" fill="#1A3055"/>
    <rect x="10" y="128" width="8" height="40" fill="#142840"/>
    <rect x="112" y="128" width="8" height="40" fill="#142840"/>
    <!-- Tablet -->
    <rect x="20" y="55" width="90" height="68" rx="5" fill="#0D1E35"/>
    <rect x="26" y="62" width="78" height="54" rx="2" fill="#1A4A8A"/>
    <!-- Screen content - text/course material -->
    <rect x="32" y="68" width="50" height="5" rx="2" fill="#E8B030"/>
    <rect x="32" y="78" width="66" height="3" rx="1" fill="#6B8FAE" opacity="0.6"/>
    <rect x="32" y="85" width="60" height="3" rx="1" fill="#6B8FAE" opacity="0.5"/>
    <rect x="32" y="92" width="55" height="3" rx="1" fill="#6B8FAE" opacity="0.5"/>
    <rect x="32" y="99" width="64" height="3" rx="1" fill="#6B8FAE" opacity="0.5"/>
    <!-- Home button -->
    <circle cx="65" cy="120" r="4" fill="#0F2540"/>
    <!-- Person silhouette -->
    <circle cx="65" cy="32" r="18" fill="#1A4A8A"/>
    <ellipse cx="65" cy="78" rx="28" ry="22" fill="#1A3A60"/>
    <!-- Face details -->
    <circle cx="58" cy="30" r="2.5" fill="#6B8FAE"/>
    <circle cx="72" cy="30" r="2.5" fill="#6B8FAE"/>
    <path d="M60,39 Q65,44 70,39" fill="none" stroke="#6B8FAE" stroke-width="1.5"/>
  </g>

  <!-- Title text -->
  <text x="200" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#C89930" letter-spacing="2">LIVE ONLINE LEARNING</text>
</svg>
