<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ft" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFE880"/>
      <stop offset="45%" stop-color="#D4A030"/>
      <stop offset="100%" stop-color="#9A7020"/>
    </linearGradient>
    <linearGradient id="fl" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9A7020"/>
      <stop offset="100%" stop-color="#4A2C00"/>
    </linearGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8892A"/>
      <stop offset="100%" stop-color="#5C3800"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="16" cy="29" rx="10" ry="2" fill="rgba(0,0,0,0.18)"/>
  <!-- right face -->
  <polygon points="27,9 27,23 16,29 16,15" fill="url(#fr)"/>
  <!-- left face -->
  <polygon points="5,9 16,15 16,29 5,23" fill="url(#fl)"/>
  <!-- top face -->
  <polygon points="5,9 16,3 27,9 16,15" fill="url(#ft)"/>
  <!-- top highlight edges -->
  <line x1="5" y1="9" x2="16" y2="3" stroke="rgba(255,248,180,0.92)" stroke-width="0.8"/>
  <line x1="16" y1="3" x2="27" y2="9" stroke="rgba(255,235,140,0.5)" stroke-width="0.6"/>
  <!-- circuit dot centre -->
  <circle cx="16" cy="9" r="1.8" fill="#FFFFFF" opacity="0.75"/>
</svg>
