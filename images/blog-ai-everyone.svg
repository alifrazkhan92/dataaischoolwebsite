<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Diverse professionals learning to implement AI together, illustrated figures around a shared workspace">
 <defs>
 <linearGradient id="bgEv" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#0A2240"/>
 <stop offset="100%" stop-color="#0E3268"/>
 </linearGradient>
 <linearGradient id="goldEv" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#C89930"/>
 <stop offset="100%" stop-color="#A8690A"/>
 </linearGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#C89930" stop-opacity="0.35"/>
 <stop offset="100%" stop-color="#C89930" stop-opacity="0"/>
 </radialGradient>
 </defs>

 <!-- Background -->
 <rect width="800" height="360" fill="url(#bgEv)"/>

 <!-- Soft network grid -->
 <g stroke="#1A3A6E" stroke-width="0.6" opacity="0.45">
 <line x1="0" y1="120" x2="800" y2="120"/>
 <line x1="0" y1="200" x2="800" y2="200"/>
 <line x1="0" y1="280" x2="800" y2="280"/>
 <line x1="160" y1="0" x2="160" y2="360"/>
 <line x1="320" y1="0" x2="320" y2="360"/>
 <line x1="480" y1="0" x2="480" y2="360"/>
 <line x1="640" y1="0" x2="640" y2="360"/>
 </g>

 <!-- Central glow behind shared screen -->
 <circle cx="400" cy="200" r="180" fill="url(#glow)"/>

 <!-- Connecting neural lines between people and central screen -->
 <g stroke="#C89930" stroke-width="1.2" opacity="0.55" fill="none">
 <path d="M 130 230 Q 250 210 360 190"/>
 <path d="M 280 290 Q 340 240 380 210"/>
 <path d="M 520 290 Q 460 240 420 210"/>
 <path d="M 670 230 Q 550 210 440 190"/>
 </g>

 <!-- Floating data nodes on the connection lines -->
 <g fill="#C89930">
 <circle cx="245" cy="215" r="3"/>
 <circle cx="340" cy="240" r="3"/>
 <circle cx="460" cy="240" r="3"/>
 <circle cx="555" cy="215" r="3"/>
 </g>

 <!-- Central shared screen / hologram -->
 <g transform="translate(340, 130)">
 <rect width="120" height="80" rx="6" fill="#0A2240" stroke="#C89930" stroke-width="2"/>
 <!-- Mini chart bars -->
 <rect x="14" y="50" width="10" height="20" fill="#C89930" opacity="0.8"/>
 <rect x="30" y="40" width="10" height="30" fill="#C89930"/>
 <rect x="46" y="30" width="10" height="40" fill="#C89930" opacity="0.9"/>
 <rect x="62" y="22" width="10" height="48" fill="#C89930"/>
 <rect x="78" y="34" width="10" height="36" fill="#C89930" opacity="0.85"/>
 <rect x="94" y="18" width="10" height="52" fill="#C89930"/>
 <!-- AI label -->
 <text x="60" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#C89930" letter-spacing="2">AI</text>
 </g>

 <!-- Person 1, left (with laptop) -->
 <g transform="translate(80, 180)">
 <!-- Head -->
 <circle cx="32" cy="22" r="18" fill="#E6D7B8"/>
 <!-- Hair -->
 <path d="M 14 18 Q 14 5 32 5 Q 50 5 50 18 Q 46 12 32 12 Q 18 12 14 18 Z" fill="#3A2E1E"/>
 <!-- Body / shoulders -->
 <path d="M 8 80 Q 8 48 32 48 Q 56 48 56 80 Z" fill="#C89930"/>
 <!-- Laptop -->
 <rect x="6" y="76" width="52" height="6" rx="1" fill="#0A2240"/>
 <rect x="10" y="60" width="44" height="18" rx="2" fill="#0A2240" stroke="#C89930" stroke-width="1"/>
 <line x1="14" y1="66" x2="50" y2="66" stroke="#C89930" stroke-width="0.8"/>
 <line x1="14" y1="70" x2="46" y2="70" stroke="#C89930" stroke-width="0.8"/>
 <line x1="14" y1="74" x2="42" y2="74" stroke="#C89930" stroke-width="0.8"/>
 </g>

 <!-- Person 2, centre-left (with notepad) -->
 <g transform="translate(230, 215)">
 <!-- Head -->
 <circle cx="28" cy="22" r="17" fill="#D4B896"/>
 <!-- Hair (long) -->
 <path d="M 11 18 Q 11 4 28 4 Q 45 4 45 20 Q 45 38 41 50 L 38 50 Q 43 40 43 22 Q 43 14 28 14 Q 14 14 11 18 Z" fill="#1F1206"/>
 <!-- Body -->
 <path d="M 6 75 Q 6 44 28 44 Q 50 44 50 75 Z" fill="#F4F1EA"/>
 <!-- Notepad -->
 <rect x="14" y="58" width="28" height="14" rx="1" fill="#FFFFFF" stroke="#0A2240" stroke-width="1"/>
 <line x1="18" y1="62" x2="38" y2="62" stroke="#0A2240" stroke-width="0.7"/>
 <line x1="18" y1="65" x2="36" y2="65" stroke="#0A2240" stroke-width="0.7"/>
 <line x1="18" y1="68" x2="34" y2="68" stroke="#0A2240" stroke-width="0.7"/>
 </g>

 <!-- Person 3, centre-right (tablet) -->
 <g transform="translate(480, 215)">
 <!-- Head -->
 <circle cx="28" cy="22" r="17" fill="#8E6A4D"/>
 <!-- Hair (short curly) -->
 <path d="M 11 18 Q 11 2 28 2 Q 45 2 45 18 Q 41 14 28 14 Q 16 14 11 18 Z" fill="#2A1A0A"/>
 <!-- Body -->
 <path d="M 6 75 Q 6 44 28 44 Q 50 44 50 75 Z" fill="#0A2240"/>
 <!-- Tablet -->
 <rect x="14" y="58" width="28" height="18" rx="2" fill="#C89930"/>
 <rect x="16" y="60" width="24" height="14" rx="1" fill="#0A2240"/>
 <circle cx="28" cy="67" r="3" fill="#C89930" opacity="0.9"/>
 </g>

 <!-- Person 4, right (with chart printout) -->
 <g transform="translate(630, 180)">
 <!-- Head -->
 <circle cx="32" cy="22" r="18" fill="#E6C9A0"/>
 <!-- Hijab / scarf -->
 <path d="M 12 22 Q 12 0 32 0 Q 52 0 52 22 Q 52 36 48 44 L 16 44 Q 12 36 12 22 Z" fill="#7A1F2B"/>
 <ellipse cx="32" cy="24" rx="14" ry="16" fill="#E6C9A0"/>
 <!-- Body -->
 <path d="M 8 80 Q 8 48 32 48 Q 56 48 56 80 Z" fill="#7A1F2B"/>
 <!-- Chart printout -->
 <rect x="12" y="60" width="40" height="22" rx="1" fill="#FFFFFF" stroke="#0A2240" stroke-width="1"/>
 <polyline points="16,76 22,68 28,72 34,64 40,70 48,62" fill="none" stroke="#A8690A" stroke-width="1.5"/>
 <line x1="16" y1="80" x2="48" y2="80" stroke="#0A2240" stroke-width="0.6"/>
 </g>

 <!-- Title text in upper area -->
 <g font-family="Georgia, 'Times New Roman', serif">
 <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">AI Implementation for Everyone</text>
 <text x="400" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#C89930" letter-spacing="3" text-transform="uppercase">A PRACTICAL GUIDE</text>
 </g>

 <!-- Gold accent rule -->
 <line x1="320" y1="48" x2="480" y2="48" stroke="url(#goldEv)" stroke-width="0.8" opacity="0.7"/>

 <!-- Bottom, small concept tags -->
 <g font-family="Georgia, serif" font-size="9" font-weight="700" fill="#C89930" letter-spacing="1.5" text-anchor="middle">
 <text x="105" y="340">LEARN</text>
 <text x="255" y="340">PROTOTYPE</text>
 <text x="400" y="340">DEPLOY</text>
 <text x="540" y="340">EVALUATE</text>
 <text x="700" y="340">SCALE</text>
 </g>
</svg>
