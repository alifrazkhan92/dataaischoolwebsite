<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Subtle pattern -->
  <g clip-path="url(#circle)" opacity="0.06" stroke="#C89930" stroke-width="0.5" fill="none">
    <circle cx="100" cy="100" r="30"/><circle cx="100" cy="100" r="55"/>
    <circle cx="100" cy="100" r="80"/>
  </g>

  <!-- Body / smart top -->
  <ellipse cx="100" cy="195" rx="62" ry="38" fill="#0A2240"/>
  <path d="M38,200 Q50,155 82,142 Q100,148 118,142 Q150,155 162,200Z" fill="#1A3A6A"/>
  <!-- Blouse collar -->
  <path d="M88,138 Q100,148 112,138 L108,128 Q100,134 92,128Z" fill="#E8B030" opacity="0.8"/>

  <!-- Hijab — navy with gold accent -->
  <ellipse cx="100" cy="96" rx="44" ry="50" fill="#0D2745"/>
  <path d="M56,96 Q56,130 62,145 Q75,160 100,163 Q125,160 138,145 Q144,130 144,96 Q144,65 100,62 Q56,65 56,96Z" fill="#0D2745"/>
  <!-- Hijab front frame -->
  <ellipse cx="100" cy="100" rx="34" ry="36" fill="#C8956A"/>
  <!-- Hijab pin/accent -->
  <circle cx="100" cy="138" r="4" fill="#C89930" opacity="0.9"/>

  <!-- Neck -->
  <rect x="90" y="120" width="20" height="20" rx="3" fill="#C8956A"/>

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="32" ry="33" fill="#C8956A"/>

  <!-- Eyes — slightly larger, feminine -->
  <ellipse cx="88" cy="98" rx="5.5" ry="5.5" fill="#1A1008"/>
  <ellipse cx="112" cy="98" rx="5.5" ry="5.5" fill="#1A1008"/>
  <circle cx="89.5" cy="96.5" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="113.5" cy="96.5" r="1.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Eyelashes (upper) -->
  <path d="M82,94 Q88,90 94,92" fill="none" stroke="#1A1008" stroke-width="2" stroke-linecap="round"/>
  <path d="M106,92 Q112,90 118,94" fill="none" stroke="#1A1008" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyebrows — defined -->
  <path d="M82,89 Q88,85 94,87" fill="none" stroke="#3A2010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M106,87 Q112,85 118,89" fill="none" stroke="#3A2010" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M97,103 Q100,110 103,103" fill="none" stroke="#B07850" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Warm smile -->
  <path d="M88,116 Q100,125 112,116" fill="none" stroke="#1A1008" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M90,116 Q100,119 110,116" fill="#D4886A" opacity="0.3"/>

  <!-- Earring hint (visible in face gap) -->
  <circle cx="68" cy="105" r="3.5" fill="#C89930" opacity="0.9"/>
</svg>
