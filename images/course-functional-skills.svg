<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <g stroke="#6B8FAE" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="80" x2="900" y2="80"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/><line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="180" y1="0" x2="180" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="540" y1="0" x2="540" y2="400"/><line x1="720" y1="0" x2="720" y2="400"/>
  </g>

  <!-- Left: Open book illustration -->
  <g transform="translate(220,200)">
    <!-- Book spine -->
    <rect x="-4" y="-140" width="8" height="280" rx="4" fill="#C89930" opacity="0.9"/>
    <!-- Left page -->
    <path d="M-4,-130 Q-130,-120 -140,-10 Q-130,100 -4,130 Z" fill="#F5F0E8" stroke="#C89930" stroke-width="1.5"/>
    <!-- Left page lines -->
    <g stroke="#8AABCC" stroke-width="1.2" opacity="0.4">
      <line x1="-120" y1="-70" x2="-20" y2="-70"/>
      <line x1="-125" y1="-50" x2="-20" y2="-50"/>
      <line x1="-120" y1="-30" x2="-20" y2="-30"/>
      <line x1="-125" y1="-10" x2="-20" y2="-10"/>
      <line x1="-120" y1="10" x2="-20" y2="10"/>
      <line x1="-125" y1="30" x2="-20" y2="30"/>
      <line x1="-120" y1="50" x2="-20" y2="50"/>
      <line x1="-125" y1="70" x2="-20" y2="70"/>
    </g>
    <!-- Aa text on left page -->
    <text x="-80" y="-90" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#0A2240" font-weight="700" opacity="0.7">Aa</text>
    <!-- Right page -->
    <path d="M4,-130 Q130,-120 140,-10 Q130,100 4,130 Z" fill="#F5F0E8" stroke="#C89930" stroke-width="1.5"/>
    <!-- Right page lines -->
    <g stroke="#8AABCC" stroke-width="1.2" opacity="0.4">
      <line x1="20" y1="-70" x2="120" y2="-70"/>
      <line x1="20" y1="-50" x2="125" y2="-50"/>
      <line x1="20" y1="-30" x2="120" y2="-30"/>
      <line x1="20" y1="-10" x2="125" y2="-10"/>
      <line x1="20" y1="10" x2="120" y2="10"/>
      <line x1="20" y1="30" x2="125" y2="30"/>
      <line x1="20" y1="50" x2="120" y2="50"/>
      <line x1="20" y1="70" x2="125" y2="70"/>
    </g>
    <!-- Writing/pencil on right page -->
    <text x="70" y="-90" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#0A2240" font-weight="700" opacity="0.7">Bb</text>
    <!-- Pencil icon -->
    <g transform="translate(50,100) rotate(-30)">
      <rect x="-4" y="-40" width="8" height="60" rx="2" fill="#C89930"/>
      <polygon points="-4,20 4,20 0,34" fill="#F5F0E8"/>
      <rect x="-4" y="-46" width="8" height="8" fill="#1E3A5E"/>
    </g>
  </g>

  <!-- Right: Qualification info and skills -->
  <g transform="translate(480,60)">
    <text x="0" y="30" font-family="Georgia,serif" font-size="20" fill="#FFFFFF" font-weight="700">Functional Skills English</text>
    <text x="0" y="52" font-family="Georgia,serif" font-size="13" fill="#C89930">NCFE Regulated, Internally Assessed</text>
    <line x1="0" y1="64" x2="380" y2="64" stroke="#1E3A5E" stroke-width="1"/>

    <!-- Three entry levels -->
    <g font-family="Georgia,serif">
      <text x="0" y="92" font-size="12" fill="#8AABCC">Entry Level 1</text>
      <text x="0" y="110" font-size="12" fill="#FFFFFF" font-weight="700">Functional Skills Qualification in English</text>
      <text x="0" y="126" font-size="11" fill="#C89930">603/5059/3</text>
      <line x1="0" y1="136" x2="380" y2="136" stroke="#1E3A5E" stroke-width="0.8"/>
      <text x="0" y="156" font-size="12" fill="#8AABCC">Entry Level 2</text>
      <text x="0" y="174" font-size="12" fill="#FFFFFF" font-weight="700">Functional Skills Qualification in English</text>
      <text x="0" y="190" font-size="11" fill="#C89930">603/5056/8</text>
      <line x1="0" y1="200" x2="380" y2="200" stroke="#1E3A5E" stroke-width="0.8"/>
      <text x="0" y="220" font-size="12" fill="#8AABCC">Entry Level 3</text>
      <text x="0" y="238" font-size="12" fill="#FFFFFF" font-weight="700">Functional Skills Qualification in English</text>
      <text x="0" y="254" font-size="11" fill="#C89930">603/5052/0</text>
    </g>

    <!-- Skills icons row -->
    <g transform="translate(0,270)">
      <rect x="0" y="0" width="110" height="36" rx="6" fill="#1A3A5C" stroke="#C89930" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#FFFFFF">Reading</text>
      <rect x="124" y="0" width="110" height="36" rx="6" fill="#1A3A5C" stroke="#C89930" stroke-width="1"/>
      <text x="179" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#FFFFFF">Writing</text>
      <rect x="248" y="0" width="130" height="36" rx="6" fill="#1A3A5C" stroke="#C89930" stroke-width="1"/>
      <text x="313" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#FFFFFF">Speaking</text>
    </g>
  </g>
  <rect x="0" y="390" width="900" height="4" fill="url(#gold)" opacity="0.8"/>
</svg>