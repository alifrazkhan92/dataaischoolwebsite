<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1A4A8A"/>
      <stop offset="100%" style="stop-color:#2B6CB0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#gold)"/>

  <!-- Left: Dashboard panel -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="480" height="310" rx="10" fill="#0D1E35" stroke="#1E3A5E" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="0" y="0" width="480" height="36" rx="10" fill="#112038"/>
    <rect x="0" y="18" width="480" height="18" fill="#112038"/>
    <text x="24" y="23" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#C89930">Data Science Dashboard</text>
    <rect x="420" y="10" width="50" height="16" rx="4" fill="#1A3A6A"/>
    <text x="445" y="22" text-anchor="middle" font-family="monospace" font-size="9" fill="#E8B030">LIVE</text>

    <!-- KPI row -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="96" height="50" rx="6" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
      <text x="48" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#E8B030">94.2%</text>
      <text x="48" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">Accuracy</text>

      <rect x="108" y="0" width="96" height="50" rx="6" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
      <text x="156" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#C89930">12.4K</text>
      <text x="156" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">Records</text>

      <rect x="216" y="0" width="96" height="50" rx="6" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
      <text x="264" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#E8B030">0.87</text>
      <text x="264" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">F1 Score</text>

      <rect x="324" y="0" width="96" height="50" rx="6" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
      <text x="372" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#C89930">8</text>
      <text x="372" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">Features</text>
    </g>

    <!-- Bar chart -->
    <g transform="translate(16, 115)">
      <text x="0" y="0" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Feature Importance</text>
      <g transform="translate(0, 12)">
        <!-- Bars -->
        <rect x="0" y="0" width="340" height="14" rx="3" fill="url(#gold)"/>
        <rect x="0" y="20" width="270" height="14" rx="3" fill="#1A4A8A"/>
        <rect x="0" y="40" width="230" height="14" rx="3" fill="#1A4A8A" opacity="0.8"/>
        <rect x="0" y="60" width="200" height="14" rx="3" fill="#1A4A8A" opacity="0.7"/>
        <rect x="0" y="80" width="160" height="14" rx="3" fill="#1A4A8A" opacity="0.6"/>
        <rect x="0" y="100" width="130" height="14" rx="3" fill="#1A4A8A" opacity="0.5"/>
        <!-- Labels -->
        <text x="350" y="12" font-family="monospace" font-size="9" fill="#E8B030">age</text>
        <text x="280" y="32" font-family="monospace" font-size="9" fill="#8DA3BE">income</text>
        <text x="240" y="52" font-family="monospace" font-size="9" fill="#8DA3BE">education</text>
        <text x="210" y="72" font-family="monospace" font-size="9" fill="#8DA3BE">tenure</text>
        <text x="170" y="92" font-family="monospace" font-size="9" fill="#8DA3BE">region</text>
        <text x="140" y="112" font-family="monospace" font-size="9" fill="#8DA3BE">gender</text>
      </g>
    </g>

    <!-- Scatter plot -->
    <g transform="translate(16, 245)">
      <text x="0" y="0" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Prediction vs Actual</text>
      <g transform="translate(0, 8)">
        <!-- Axes -->
        <line x1="0" y1="50" x2="200" y2="50" stroke="#1E3A5E" stroke-width="1"/>
        <line x1="0" y1="0" x2="0" y2="50" stroke="#1E3A5E" stroke-width="1"/>
        <!-- Ideal line -->
        <line x1="0" y1="50" x2="200" y2="0" stroke="#6B8FAE" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
        <!-- Scatter points -->
        <g fill="#C89930" opacity="0.8">
          <circle cx="20" cy="43" r="3"/><circle cx="40" cy="38" r="3"/>
          <circle cx="60" cy="30" r="3"/><circle cx="80" cy="25" r="3"/>
          <circle cx="100" cy="19" r="3"/><circle cx="120" cy="14" r="3"/>
          <circle cx="140" cy="9" r="3"/><circle cx="160" cy="5" r="3"/>
        </g>
        <g fill="#E8B030" opacity="0.5">
          <circle cx="30" cy="40" r="2"/><circle cx="55" cy="33" r="2"/>
          <circle cx="75" cy="28" r="2"/><circle cx="90" cy="20" r="2"/>
          <circle cx="115" cy="16" r="2"/><circle cx="145" cy="8" r="2"/>
        </g>
      </g>
    </g>

    <!-- Confusion matrix mini -->
    <g transform="translate(240, 245)">
      <text x="0" y="0" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Confusion Matrix</text>
      <g transform="translate(0, 8)">
        <rect x="0" y="0" width="30" height="30" rx="2" fill="#C89930" opacity="0.9"/>
        <rect x="35" y="0" width="30" height="30" rx="2" fill="#1A3055"/>
        <rect x="0" y="35" width="30" height="30" rx="2" fill="#1A3055"/>
        <rect x="35" y="35" width="30" height="30" rx="2" fill="#C89930" opacity="0.7"/>
        <text x="15" y="20" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0A2240">87</text>
        <text x="50" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#8DA3BE">12</text>
        <text x="15" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#8DA3BE">8</text>
        <text x="50" y="55" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0A2240">93</text>
      </g>
    </g>
  </g>

  <!-- Right: Info panel -->
  <g transform="translate(560, 80)">
    <!-- Magnifying glass icon -->
    <circle cx="80" cy="80" r="55" fill="none" stroke="#C89930" stroke-width="4"/>
    <circle cx="80" cy="80" r="42" fill="#112038"/>
    <!-- Mini chart inside glass -->
    <g transform="translate(52, 58)">
      <rect x="0" y="30" width="10" height="20" fill="#C89930" opacity="0.7" rx="1"/>
      <rect x="14" y="18" width="10" height="32" fill="#E8B030" rx="1"/>
      <rect x="28" y="8" width="10" height="42" fill="#C89930" rx="1"/>
      <polyline points="5,30 19,18 33,8" fill="none" stroke="#E8B030" stroke-width="2"/>
    </g>
    <!-- Handle -->
    <line x1="120" y1="120" x2="148" y2="150" stroke="#C89930" stroke-width="6" stroke-linecap="round"/>

    <!-- Topics -->
    <text x="0" y="185" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#C89930">Tools &amp; Skills</text>
    <g font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">
      <text x="0" y="207">▸ pandas &amp; NumPy</text>
      <text x="0" y="225">▸ Matplotlib / Seaborn</text>
      <text x="0" y="243">▸ scikit-learn ML models</text>
      <text x="0" y="261">▸ Statistics &amp; hypothesis testing</text>
      <text x="0" y="279">▸ End-to-end ML pipelines</text>
      <text x="0" y="297">▸ Real-world portfolio projects</text>
    </g>
  </g>

  <text x="450" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#C89930" letter-spacing="2">DATA SCIENCE BOOTCAMP</text>
</svg>
