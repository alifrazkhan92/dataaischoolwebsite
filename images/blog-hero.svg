<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280">
 <defs>
 <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#0A2240"/>
 <stop offset="100%" style="stop-color:#0E3268"/>
 </linearGradient>
 <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" style="stop-color:#C89930"/>
 <stop offset="100%" style="stop-color:#E8B030"/>
 </linearGradient>
 </defs>
 <rect width="1100" height="280" fill="url(#bg)"/>
 <rect x="0" y="0" width="1100" height="4" fill="url(#gold)"/>

 <!-- Subtle dot grid -->
 <g fill="#1A3A6A" opacity="0.3">
 <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
 <circle cx="900" cy="60" r="2"/><circle cx="960" cy="60" r="2"/><circle cx="1020" cy="60" r="2"/>
 <circle cx="60" cy="220" r="2"/><circle cx="120" cy="220" r="2"/>
 <circle cx="960" cy="220" r="2"/><circle cx="1020" cy="220" r="2"/>
 </g>

 <!-- Open book left -->
 <g transform="translate(60, 60)">
 <path d="M0,140 L0,10 Q0,0 10,0 Q50,-15 80,0 L80,140 Q50,125 10,140 Q0,140 0,140Z" fill="#1A3A6A"/>
 <path d="M80,140 L80,0 Q110,-15 150,0 Q160,0 160,10 L160,140 Q110,125 80,140Z" fill="#142D55"/>
 <line x1="80" y1="0" x2="80" y2="140" stroke="#0A2240" stroke-width="2"/>
 <line x1="12" y1="30" x2="72" y2="18" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
 <line x1="12" y1="45" x2="72" y2="34" stroke="#6B8FAE" stroke-width="1.5" opacity="0.4"/>
 <line x1="12" y1="60" x2="72" y2="50" stroke="#6B8FAE" stroke-width="1.5" opacity="0.4"/>
 <line x1="88" y1="28" x2="148" y2="18" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
 <line x1="88" y1="43" x2="148" y2="34" stroke="#6B8FAE" stroke-width="1.5" opacity="0.4"/>
 <!-- Gold bookmark -->
 <polygon points="55,0 65,0 65,30 60,23 55,30" fill="#C89930"/>
 </g>

 <!-- Pencil -->
 <g transform="translate(250, 50)" opacity="0.9">
 <rect x="0" y="0" width="14" height="160" rx="3" fill="#E8B030"/>
 <polygon points="0,160 14,160 7,185" fill="#F5F0E8"/>
 <polygon points="3,178 11,178 7,185" fill="#1A2A40"/>
 <rect x="0" y="0" width="14" height="18" rx="3" fill="#C89930"/>
 <rect x="0" y="16" width="14" height="6" fill="#8DA3BE"/>
 <line x1="3" y1="30" x2="11" y2="30" stroke="#A8690A" stroke-width="1" opacity="0.3"/>
 <line x1="3" y1="50" x2="11" y2="50" stroke="#A8690A" stroke-width="1" opacity="0.3"/>
 <line x1="3" y1="70" x2="11" y2="70" stroke="#A8690A" stroke-width="1" opacity="0.3"/>
 </g>

 <!-- Central text composition -->
 <g transform="translate(320, 60)">
 <text x="0" y="40" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">DAIS</text>
 <text x="0" y="80" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="url(#gold)" letter-spacing="-1">Blog</text>
 <rect x="0" y="92" width="180" height="3" rx="2" fill="#C89930"/>
 <text x="0" y="118" font-family="system-ui,sans-serif" font-size="14" fill="#8DA3BE">Expert insights on Python, Data Science,</text>
 <text x="0" y="138" font-family="system-ui,sans-serif" font-size="14" fill="#8DA3BE">AI and Agentic AI, published every week.</text>
 <!-- Tag pills -->
 <g transform="translate(0, 155)">
 <rect x="0" y="0" width="62" height="22" rx="11" fill="#1A3055" stroke="#C89930" stroke-width="1"/>
 <text x="31" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#C89930">Python</text>
 <rect x="72" y="0" width="88" height="22" rx="11" fill="#1A3055" stroke="#C89930" stroke-width="1"/>
 <text x="116" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#C89930">Data Science</text>
 <rect x="170" y="0" width="36" height="22" rx="11" fill="#C89930"/>
 <text x="188" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#0A2240" font-weight="700">AI</text>
 <rect x="216" y="0" width="88" height="22" rx="11" fill="#1A3055" stroke="#C89930" stroke-width="1"/>
 <text x="260" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#C89930">Agentic AI</text>
 </g>
 </g>

 <!-- Lightbulb idea icon (right side) -->
 <g transform="translate(760, 60)">
 <!-- Bulb -->
 <path d="M50,0 Q90,0 90,40 Q90,68 70,80 L70,100 L30,100 L30,80 Q10,68 10,40 Q10,0 50,0Z" fill="#1A3A6A" stroke="#C89930" stroke-width="2"/>
 <!-- Glow -->
 <path d="M50,5 Q82,5 82,40 Q82,62 65,75" fill="none" stroke="#E8B030" stroke-width="1.5" opacity="0.4"/>
 <!-- Filament -->
 <path d="M40,55 Q45,45 50,55 Q55,65 60,55" fill="none" stroke="#E8B030" stroke-width="2.5" stroke-linecap="round"/>
 <!-- Base -->
 <rect x="30" y="100" width="40" height="8" rx="2" fill="#1A3055" stroke="#C89930" stroke-width="1"/>
 <rect x="34" y="108" width="32" height="8" rx="2" fill="#1A3055" stroke="#C89930" stroke-width="1"/>
 <!-- Rays -->
 <g stroke="#C89930" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
 <line x1="50" y1="-15" x2="50" y2="-8"/>
 <line x1="82" y1="-5" x2="77" y2="0"/>
 <line x1="95" y1="30" x2="88" y2="33"/>
 <line x1="18" y1="-5" x2="23" y2="0"/>
 <line x1="5" y1="30" x2="12" y2="33"/>
 </g>
 </g>

 <!-- Floating notes/ideas -->
 <g transform="translate(880, 50)" opacity="0.8">
 <rect x="0" y="0" width="120" height="80" rx="6" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
 <rect x="8" y="12" width="70" height="5" rx="2" fill="#C89930" opacity="0.8"/>
 <rect x="8" y="24" width="104" height="4" rx="2" fill="#6B8FAE" opacity="0.5"/>
 <rect x="8" y="33" width="90" height="4" rx="2" fill="#6B8FAE" opacity="0.4"/>
 <rect x="8" y="42" width="98" height="4" rx="2" fill="#6B8FAE" opacity="0.4"/>
 <rect x="8" y="51" width="75" height="4" rx="2" fill="#6B8FAE" opacity="0.3"/>
 <!-- Pin -->
 <circle cx="60" cy="3" r="5" fill="#C89930"/>
 </g>

 <g transform="translate(900, 160)" opacity="0.7">
 <rect x="0" y="0" width="100" height="70" rx="6" fill="#0D1E35" stroke="#1E3A5E" stroke-width="1"/>
 <rect x="8" y="10" width="55" height="4" rx="2" fill="#E8B030" opacity="0.7"/>
 <rect x="8" y="20" width="84" height="3" rx="2" fill="#6B8FAE" opacity="0.4"/>
 <rect x="8" y="29" width="70" height="3" rx="2" fill="#6B8FAE" opacity="0.4"/>
 <rect x="8" y="38" width="78" height="3" rx="2" fill="#6B8FAE" opacity="0.3"/>
 <circle cx="50" cy="3" r="4" fill="#C89930" opacity="0.8"/>
 </g>

 <!-- Weekly badge -->
 <g transform="translate(60, 220)">
 <rect x="0" y="0" width="160" height="36" rx="18" fill="#C89930"/>
 <text x="80" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0A2240">📅 New post every week</text>
 </g>

 <rect x="0" y="276" width="1100" height="4" fill="url(#gold)"/>
</svg>
