<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#6B8FAE" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="80" x2="900" y2="80"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/><line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Left: Code editor window -->
  <g transform="translate(50, 50)">
    <!-- Editor chrome -->
    <rect x="0" y="0" width="480" height="300" rx="10" fill="#0D1E35" stroke="#1E3A5E" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="480" height="32" rx="10" fill="#112038"/>
    <rect x="0" y="16" width="480" height="16" fill="#112038"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="16" r="6" fill="#E8B030" opacity="0.7"/>
    <circle cx="38" cy="16" r="6" fill="#C89930" opacity="0.5"/>
    <circle cx="56" cy="16" r="6" fill="#1A4A8A" opacity="0.5"/>
    <!-- Filename tab -->
    <rect x="80" y="6" width="100" height="20" rx="4" fill="#1A3055"/>
    <text x="130" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#8DA3BE">main.py</text>

    <!-- Line numbers -->
    <g fill="#2A4A6A" font-family="monospace" font-size="11">
      <text x="16" y="62">01</text><text x="16" y="80">02</text><text x="16" y="98">03</text>
      <text x="16" y="116">04</text><text x="16" y="134">05</text><text x="16" y="152">06</text>
      <text x="16" y="170">07</text><text x="16" y="188">08</text><text x="16" y="206">09</text>
      <text x="16" y="224">10</text><text x="16" y="242">11</text><text x="16" y="260">12</text>
      <text x="16" y="278">13</text>
    </g>
    <line x1="40" y1="32" x2="40" y2="300" stroke="#1E3A5E" stroke-width="1"/>

    <!-- Code content -->
    <g font-family="monospace" font-size="11">
      <text x="52" y="62" fill="#E8B030">import</text>
      <text x="100" y="62" fill="#8DA3BE"> pandas </text>
      <text x="156" y="62" fill="#E8B030">as</text>
      <text x="173" y="62" fill="#8DA3BE"> pd</text>

      <text x="52" y="80" fill="#E8B030">import</text>
      <text x="100" y="80" fill="#8DA3BE"> numpy </text>
      <text x="150" y="80" fill="#E8B030">as</text>
      <text x="167" y="80" fill="#8DA3BE"> np</text>

      <text x="52" y="116" fill="#6B8FAE"># Load and explore dataset</text>

      <text x="52" y="134" fill="#C89930">def</text>
      <text x="73" y="134" fill="#E8B030"> analyse_data</text>
      <text x="175" y="134" fill="#8DA3BE">(filepath):</text>

      <text x="70" y="152" fill="#8DA3BE">df = pd.</text>
      <text x="117" y="152" fill="#E8B030">read_csv</text>
      <text x="168" y="152" fill="#8DA3BE">(filepath)</text>

      <text x="70" y="170" fill="#6B8FAE">    # Basic exploration</text>

      <text x="70" y="188" fill="#8DA3BE">print(df.</text>
      <text x="120" y="188" fill="#E8B030">describe</text>
      <text x="170" y="188" fill="#8DA3BE">())</text>

      <text x="70" y="206" fill="#8DA3BE">print(df.</text>
      <text x="120" y="206" fill="#E8B030">shape</text>
      <text x="156" y="206" fill="#8DA3BE">)</text>

      <text x="70" y="224" fill="#C89930">    return</text>
      <text x="117" y="224" fill="#8DA3BE"> df</text>

      <text x="52" y="260" fill="#6B8FAE"># Entry point</text>
      <text x="52" y="278" fill="#C89930">if</text>
      <text x="65" y="278" fill="#8DA3BE"> __name__ == </text>
      <text x="170" y="278" fill="#E8B030">"__main__"</text>
      <text x="232" y="278" fill="#8DA3BE">:</text>
    </g>

    <!-- Cursor -->
    <rect x="52" y="283" width="6" height="11" fill="#C89930" opacity="0.85"/>
  </g>

  <!-- Right: Python snake logo + info -->
  <g transform="translate(580, 80)">
    <!-- Snake illustration -->
    <path d="M110,40 Q70,40 70,70 L70,100 Q70,120 90,120 L130,120 Q160,120 160,150 L160,180 Q160,200 140,200 Q120,200 120,180"
          fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="110" cy="30" r="18" fill="#C89930"/>
    <circle cx="120" cy="190" r="18" fill="#1A4A8A" stroke="#C89930" stroke-width="3"/>
    <!-- Eye -->
    <circle cx="115" cy="27" r="4" fill="#0A2240"/>
    <circle cx="116" cy="195" r="4" fill="#E8B030"/>
  </g>

  <!-- Key topics -->
  <g transform="translate(580, 240)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#C89930">What you'll learn</text>
    <g font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">
      <text x="0" y="22">▸ Variables, types &amp; control flow</text>
      <text x="0" y="40">▸ Object-oriented programming</text>
      <text x="0" y="58">▸ APIs, file I/O &amp; data handling</text>
      <text x="0" y="76">▸ Testing, debugging &amp; tooling</text>
      <text x="0" y="94">▸ Git, environments &amp; IDEs</text>
    </g>
  </g>

  <!-- Gold top bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#gold)"/>
  <text x="450" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#C89930" letter-spacing="2">PYTHON LANGUAGE BOOTCAMP</text>
</svg>
