<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)"/>
  <g stroke="#6B8FAE" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="80" x2="900" y2="80"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/><line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="180" y1="0" x2="180" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="540" y1="0" x2="540" y2="400"/><line x1="720" y1="0" x2="720" y2="400"/>
  </g>

  <!-- Left: Code editor -->
  <g transform="translate(50,50)">
    <rect x="0" y="0" width="460" height="300" rx="10" fill="#0D1E35" stroke="#1E3A5E" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="32" rx="10" fill="#112038"/>
    <rect x="0" y="16" width="460" height="16" fill="#112038"/>
    <circle cx="20" cy="16" r="6" fill="#E8B030" opacity="0.7"/>
    <circle cx="40" cy="16" r="6" fill="#2ECC71" opacity="0.7"/>
    <circle cx="60" cy="16" r="6" fill="#E74C3C" opacity="0.7"/>
    <text x="230" y="21" text-anchor="middle" font-family="monospace" font-size="11" fill="#6B8FAE">programming.py</text>
    <!-- Line numbers -->
    <g font-family="monospace" font-size="12" fill="#3A5A7A">
      <text x="16" y="60">1</text><text x="16" y="80">2</text><text x="16" y="100">3</text>
      <text x="16" y="120">4</text><text x="16" y="140">5</text><text x="16" y="160">6</text>
      <text x="16" y="180">7</text><text x="16" y="200">8</text><text x="16" y="220">9</text>
      <text x="10" y="240">10</text><text x="10" y="260">11</text><text x="10" y="280">12</text>
    </g>
    <!-- Code content -->
    <g font-family="monospace" font-size="12.5">
      <text x="36" y="60" fill="#C89930">class</text>
      <text x="84" y="60" fill="#7EC8E3"> QualificationPortfolio</text>
      <text x="84" y="60" fill="#FFFFFF" dx="178">:</text>
      <text x="36" y="80" fill="#6B8FAE">    """NCFE Level 4 portfolio system."""</text>
      <text x="36" y="100" fill="#C89930">    def</text>
      <text x="76" y="100" fill="#7EC8E3"> __init__</text>
      <text x="76" y="100" fill="#FFFFFF" dx="66">(self, learner, course):</text>
      <text x="36" y="120" fill="#FFFFFF">        self.learner = learner</text>
      <text x="36" y="140" fill="#FFFFFF">        self.course  = course</text>
      <text x="36" y="160" fill="#FFFFFF">        self.tasks   = []</text>
      <text x="36" y="180" fill="#C89930">    def</text>
      <text x="76" y="180" fill="#7EC8E3"> submit_task</text>
      <text x="76" y="180" fill="#FFFFFF" dx="84">(self, task):</text>
      <text x="36" y="200" fill="#2ECC71" opacity="0.8">        # Validates and stores evidence</text>
      <text x="36" y="220" fill="#FFFFFF">        self.tasks.append(task)</text>
      <text x="36" y="240" fill="#FFFFFF">        </text>
      <text x="36" y="240" fill="#C89930">return</text>
      <text x="36" y="240" fill="#FFFFFF" dx="44"> len(self.tasks)</text>
      <text x="36" y="260" fill="#C89930">    def</text>
      <text x="76" y="260" fill="#7EC8E3"> get_grade</text>
      <text x="76" y="260" fill="#FFFFFF" dx="68">(self):</text>
      <text x="36" y="280" fill="#FFFFFF">        </text>
      <text x="36" y="280" fill="#C89930">return</text>
      <text x="36" y="280" fill="#7EC8E3" dx="44"> self</text>
      <text x="36" y="280" fill="#FFFFFF" dx="144">._assess()</text>
    </g>
    <!-- Cursor blink -->
    <rect x="274" y="268" width="8" height="14" fill="#C89930" opacity="0.9" rx="1"/>
  </g>

  <!-- Right: Language badges + level info -->
  <g transform="translate(550,50)">
    <text x="0" y="30" font-family="Georgia,serif" font-size="20" fill="#FFFFFF" font-weight="700">Programming</text>
    <text x="0" y="52" font-family="Georgia,serif" font-size="13" fill="#C89930">NCFE Regulated Qualifications</text>

    <!-- Language pills -->
    <g font-family="monospace" font-size="13">
      <rect x="0" y="70" width="70" height="26" rx="13" fill="#1A3A5C" stroke="#C89930" stroke-width="1"/>
      <text x="35" y="88" text-anchor="middle" fill="#C89930">Python</text>
      <rect x="82" y="70" width="56" height="26" rx="13" fill="#1A3A5C" stroke="#7EC8E3" stroke-width="1"/>
      <text x="110" y="88" text-anchor="middle" fill="#7EC8E3">Java</text>
      <rect x="150" y="70" width="44" height="26" rx="13" fill="#1A3A5C" stroke="#7EC8E3" stroke-width="1"/>
      <text x="172" y="88" text-anchor="middle" fill="#7EC8E3">C#</text>
      <rect x="206" y="70" width="54" height="26" rx="13" fill="#1A3A5C" stroke="#7EC8E3" stroke-width="1"/>
      <text x="233" y="88" text-anchor="middle" fill="#7EC8E3">PHP</text>
    </g>

    <!-- Qualification levels -->
    <g transform="translate(0,115)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#1E3A5E" stroke-width="1"/>
      <g font-family="Georgia,serif">
        <text x="0" y="28" font-size="12" fill="#8AABCC">Level 2</text>
        <text x="0" y="46" font-size="12" fill="#FFFFFF" font-weight="700">Certificate in Understanding Coding</text>
        <text x="0" y="62" font-size="11" fill="#C89930">603/5854/3</text>
        <line x1="0" y1="72" x2="300" y2="72" stroke="#1E3A5E" stroke-width="0.8"/>
        <text x="0" y="92" font-size="12" fill="#8AABCC">Level 3</text>
        <text x="0" y="110" font-size="12" fill="#FFFFFF" font-weight="700">Certificate in Coding Practices</text>
        <text x="0" y="126" font-size="11" fill="#C89930">603/5793/9</text>
        <line x1="0" y1="136" x2="300" y2="136" stroke="#1E3A5E" stroke-width="0.8"/>
        <text x="0" y="156" font-size="12" fill="#8AABCC">Level 4</text>
        <text x="0" y="174" font-size="12" fill="#FFFFFF" font-weight="700">Award in Programming</text>
        <text x="0" y="192" font-size="11" fill="#C89930">Python  |  Java  |  C#  |  PHP</text>
      </g>
    </g>
  </g>

  <!-- Gold rule bottom -->
  <rect x="0" y="390" width="900" height="4" fill="url(#gold)" opacity="0.8"/>
</svg>