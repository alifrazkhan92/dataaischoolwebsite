<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g stroke="#6B8FAE" stroke-width="0.4" opacity="0.06">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/>
  </g>
  <!-- Gold rule at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#C89930" font-weight="700" letter-spacing="3">NCFE REGULATED QUALIFICATIONS</text>
  <text x="600" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8AABCC" letter-spacing="1">The Data and AI School of London</text>

  <!-- Gold divider -->
  <line x1="200" y1="85" x2="1000" y2="85" stroke="#C89930" stroke-width="0.8" opacity="0.4"/>

  <!-- 5 category columns -->
  <!-- 1. Programming (x=120) -->
  <g transform="translate(120,110)">
    <circle cx="0" cy="30" r="38" fill="#0D1E35" stroke="#C89930" stroke-width="1.5" opacity="0.9"/>
    <!-- code brackets -->
    <text x="0" y="38" text-anchor="middle" font-family="monospace" font-size="28" fill="#C89930" font-weight="700">&lt;/&gt;</text>
    <text x="0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#FFFFFF" font-weight="700">Programming</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8AABCC">Levels 2, 3, 4</text>
    <text x="0" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C89930">6 qualifications</text>
  </g>

  <!-- 2. Cyber Security (x=360) -->
  <g transform="translate(360,110)">
    <circle cx="0" cy="30" r="38" fill="#0D1E35" stroke="#C89930" stroke-width="1.5" opacity="0.9"/>
    <!-- shield -->
    <path d="M0,-16 L18,0 L18,16 Q18,32 0,40 Q-18,32 -18,16 L-18,0 Z" fill="none" stroke="#C89930" stroke-width="2.5" transform="translate(0,28)"/>
    <line x1="0" y1="30" x2="0" y2="50" stroke="#C89930" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#FFFFFF" font-weight="700">Cyber Security</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8AABCC">Levels 2, 3, 4</text>
    <text x="0" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C89930">4 qualifications</text>
  </g>

  <!-- 3. Data Science (x=600) -->
  <g transform="translate(600,110)">
    <circle cx="0" cy="30" r="38" fill="#0D1E35" stroke="#C89930" stroke-width="1.5" opacity="0.9"/>
    <!-- bar chart -->
    <rect x="-16" y="12" width="8" height="28" fill="#C89930" opacity="0.9" transform="translate(0,10)"/>
    <rect x="-4" y="4" width="8" height="36" fill="#E8B030" opacity="0.8" transform="translate(0,10)"/>
    <rect x="8" y="18" width="8" height="22" fill="#C89930" opacity="0.7" transform="translate(0,10)"/>
    <text x="0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#FFFFFF" font-weight="700">Data Science</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8AABCC">Levels 2, 3, 4</text>
    <text x="0" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C89930">4 qualifications</text>
  </g>

  <!-- 4. Cloud (x=840) -->
  <g transform="translate(840,110)">
    <circle cx="0" cy="30" r="38" fill="#0D1E35" stroke="#C89930" stroke-width="1.5" opacity="0.9"/>
    <!-- cloud shape -->
    <g transform="translate(0,28)">
      <ellipse cx="-8" cy="4" rx="14" ry="11" fill="none" stroke="#C89930" stroke-width="2"/>
      <ellipse cx="8" cy="6" rx="11" ry="9" fill="none" stroke="#C89930" stroke-width="2"/>
      <ellipse cx="0" cy="-2" rx="10" ry="12" fill="none" stroke="#C89930" stroke-width="2"/>
      <rect x="-15" y="10" width="30" height="6" fill="#0D1E35"/>
      <line x1="-8" y1="16" x2="-8" y2="28" stroke="#C89930" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="0" y1="16" x2="0" y2="26" stroke="#C89930" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="8" y1="16" x2="8" y2="28" stroke="#C89930" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>
    <text x="0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#FFFFFF" font-weight="700">Cloud and Digital</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8AABCC">Levels 3, 5 (inc HTQ)</text>
    <text x="0" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C89930">3 qualifications</text>
  </g>

  <!-- 5. Functional Skills (x=1080) -->
  <g transform="translate(1080,110)">
    <circle cx="0" cy="30" r="38" fill="#0D1E35" stroke="#C89930" stroke-width="1.5" opacity="0.9"/>
    <!-- open book -->
    <g transform="translate(0,28)">
      <path d="M-20,12 L-20,-12 Q-20,-16 -16,-16 Q-8,-16 0,-10 L0,16 Q-8,10 -16,10 Z" fill="none" stroke="#C89930" stroke-width="2"/>
      <path d="M20,12 L20,-12 Q20,-16 16,-16 Q8,-16 0,-10 L0,16 Q8,10 16,10 Z" fill="none" stroke="#C89930" stroke-width="2"/>
      <line x1="0" y1="-10" x2="0" y2="16" stroke="#C89930" stroke-width="1.5"/>
    </g>
    <text x="0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#FFFFFF" font-weight="700">Functional Skills</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8AABCC">Entry Levels 1, 2, 3</text>
    <text x="0" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C89930">English (internally assessed)</text>
  </g>

  <!-- connecting gold line between categories -->
  <line x1="120" y1="148" x2="1080" y2="148" stroke="#C89930" stroke-width="0.8" opacity="0.25"/>

  <!-- Bottom: NCFE badge area -->
  <rect x="0" y="300" width="1200" height="60" fill="#061628" opacity="0.6"/>
  <text x="600" y="327" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#C89930" letter-spacing="2">REGULATED BY NCFE</text>
  <text x="600" y="348" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8AABCC">All qualifications sit on the Regulated Qualifications Framework (RQF) and are approved by Ofqual</text>
  <!-- Gold rule at bottom -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#gold)"/>
</svg>