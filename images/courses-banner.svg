<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="50%" style="stop-color:#0E3268"/>
      <stop offset="100%" style="stop-color:#0A2240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#6B8FAE" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/><line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/><line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/><line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Gold top stripe -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldGrad)"/>

  <!-- Central heading -->
  <text x="600" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Our Programmes</text>
  <text x="600" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#8DA3BE">Four intensive bootcamps — take one or stack them all</text>
  <rect x="540" y="120" width="120" height="3" rx="2" fill="url(#goldGrad)"/>

  <!-- Four course cards in a row -->
  <!-- Python -->
  <g transform="translate(60, 155)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#C89930"/>
    <!-- Python snake icon -->
    <g transform="translate(20, 20)">
      <path d="M30,0 Q0,0 0,15 L0,30 Q0,40 15,40 L45,40 Q60,40 60,55 L60,70 Q60,80 45,80 Q30,80 30,70" fill="none" stroke="#E8B030" stroke-width="5" stroke-linecap="round"/>
      <circle cx="30" cy="0" r="8" fill="#C89930"/>
      <circle cx="30" cy="80" r="8" fill="#C89930"/>
    </g>
    <text x="120" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Python</text>
    <text x="120" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Language</text>
    <rect x="20" y="100" width="200" height="2" fill="#1E3A5E"/>
    <text x="20" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Syntax · OOP · APIs · Testing</text>
    <text x="20" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Git · Environments · IDEs</text>
  </g>

  <!-- Data Science -->
  <g transform="translate(340, 155)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#C89930"/>
    <!-- Bar chart icon -->
    <g transform="translate(20, 18)">
      <rect x="0" y="40" width="15" height="30" fill="#C89930" opacity="0.6" rx="2"/>
      <rect x="20" y="25" width="15" height="45" fill="#C89930" opacity="0.8" rx="2"/>
      <rect x="40" y="10" width="15" height="60" fill="#E8B030" rx="2"/>
      <rect x="60" y="30" width="15" height="40" fill="#C89930" opacity="0.7" rx="2"/>
      <polyline points="7,40 27,25 47,10 67,30" fill="none" stroke="#E8B030" stroke-width="2"/>
    </g>
    <text x="120" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Data Science</text>
    <text x="120" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Analysis &amp; ML</text>
    <rect x="20" y="100" width="200" height="2" fill="#1E3A5E"/>
    <text x="20" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">pandas · NumPy · scikit-learn</text>
    <text x="20" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Statistics · ML Pipelines</text>
  </g>

  <!-- AI -->
  <g transform="translate(620, 155)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#C89930"/>
    <!-- Neural network icon -->
    <g transform="translate(15, 15)">
      <circle cx="10" cy="20" r="7" fill="#1A4A8A" stroke="#C89930" stroke-width="1.5"/>
      <circle cx="10" cy="45" r="7" fill="#1A4A8A" stroke="#C89930" stroke-width="1.5"/>
      <circle cx="10" cy="70" r="7" fill="#1A4A8A" stroke="#C89930" stroke-width="1.5"/>
      <circle cx="50" cy="12" r="7" fill="#1A4A8A" stroke="#E8B030" stroke-width="1.5"/>
      <circle cx="50" cy="37" r="7" fill="#1A4A8A" stroke="#E8B030" stroke-width="1.5"/>
      <circle cx="50" cy="62" r="7" fill="#1A4A8A" stroke="#E8B030" stroke-width="1.5"/>
      <circle cx="50" cy="77" r="7" fill="#1A4A8A" stroke="#E8B030" stroke-width="1.5"/>
      <circle cx="88" cy="30" r="9" fill="#C89930"/>
      <circle cx="88" cy="60" r="9" fill="#C89930"/>
      <g stroke="#6B8FAE" stroke-width="0.8" opacity="0.5">
        <line x1="17" y1="20" x2="43" y2="12"/><line x1="17" y1="20" x2="43" y2="37"/>
        <line x1="17" y1="45" x2="43" y2="37"/><line x1="17" y1="45" x2="43" y2="62"/>
        <line x1="17" y1="70" x2="43" y2="62"/><line x1="17" y1="70" x2="43" y2="77"/>
        <line x1="57" y1="12" x2="79" y2="30"/><line x1="57" y1="37" x2="79" y2="30"/>
        <line x1="57" y1="62" x2="79" y2="60"/><line x1="57" y1="77" x2="79" y2="60"/>
      </g>
    </g>
    <text x="120" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">AI</text>
    <text x="120" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">LLMs &amp; Applications</text>
    <rect x="20" y="100" width="200" height="2" fill="#1E3A5E"/>
    <text x="20" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">LLMs · RAG · Embeddings</text>
    <text x="20" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Prompting · Fine-tuning</text>
  </g>

  <!-- Agentic AI -->
  <g transform="translate(900, 155)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#C89930"/>
    <!-- Agent nodes icon -->
    <g transform="translate(10, 10)">
      <circle cx="60" cy="20" r="14" fill="#C89930"/>
      <text x="60" y="25" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#0A2240">AI</text>
      <circle cx="18" cy="65" r="10" fill="#1A4A8A" stroke="#C89930" stroke-width="1.5"/>
      <circle cx="60" cy="78" r="10" fill="#1A4A8A" stroke="#C89930" stroke-width="1.5"/>
      <circle cx="102" cy="65" r="10" fill="#1A4A8A" stroke="#C89930" stroke-width="1.5"/>
      <line x1="46" y1="28" x2="26" y2="56" stroke="#C89930" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="60" y1="34" x2="60" y2="68" stroke="#C89930" stroke-width="1.5" stroke-dasharray="3,2"/>
      <line x1="74" y1="28" x2="94" y2="56" stroke="#C89930" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="18" y="69" text-anchor="middle" font-family="monospace" font-size="8" fill="#E8B030">T1</text>
      <text x="60" y="82" text-anchor="middle" font-family="monospace" font-size="8" fill="#E8B030">T2</text>
      <text x="102" y="69" text-anchor="middle" font-family="monospace" font-size="8" fill="#E8B030">T3</text>
    </g>
    <text x="120" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Agentic AI</text>
    <text x="120" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Agents &amp; Orchestration</text>
    <rect x="20" y="100" width="200" height="2" fill="#1E3A5E"/>
    <text x="20" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Tool Use · Multi-step Workflows</text>
    <text x="20" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Observability · Safety</text>
  </g>

  <!-- Gold bottom stripe -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#goldGrad)"/>
</svg>
