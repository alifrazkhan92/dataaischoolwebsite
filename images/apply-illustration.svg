<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#gold)"/>

  <!-- Left: Application form illustration -->
  <g transform="translate(50, 50)">
    <!-- Form card -->
    <rect x="0" y="0" width="320" height="290" rx="12" fill="#0D1E35" stroke="#1E3A5E" stroke-width="1.5"/>
    <!-- Form header -->
    <rect x="0" y="0" width="320" height="44" rx="12" fill="#112038"/>
    <rect x="0" y="22" width="320" height="22" fill="#112038"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Course Application</text>
    <rect x="260" y="12" width="48" height="18" rx="4" fill="#C89930"/>
    <text x="284" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#0A2240">APPLY</text>

    <!-- Form fields -->
    <g transform="translate(20, 60)">
      <!-- Full name -->
      <text x="0" y="0" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Full Name *</text>
      <rect x="0" y="6" width="280" height="28" rx="5" fill="#1A3055" stroke="#2A4A6A" stroke-width="1"/>
      <text x="10" y="25" font-family="system-ui,sans-serif" font-size="11" fill="#FFFFFF">Ali Fraz Khan</text>

      <!-- Email -->
      <text x="0" y="50" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Email Address *</text>
      <rect x="0" y="56" width="280" height="28" rx="5" fill="#1A3055" stroke="#C89930" stroke-width="1.5"/>
      <text x="10" y="75" font-family="system-ui,sans-serif" font-size="11" fill="#FFFFFF">student@example.com</text>
      <!-- Cursor -->
      <rect x="178" y="65" width="1.5" height="14" fill="#C89930"/>

      <!-- Course select -->
      <text x="0" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Course *</text>
      <rect x="0" y="106" width="280" height="28" rx="5" fill="#1A3055" stroke="#2A4A6A" stroke-width="1"/>
      <text x="10" y="125" font-family="system-ui,sans-serif" font-size="11" fill="#FFFFFF">Data Science</text>
      <text x="260" y="125" font-family="system-ui,sans-serif" font-size="14" fill="#6B8FAE">∨</text>

      <!-- Motivation -->
      <text x="0" y="150" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Background &amp; Motivation</text>
      <rect x="0" y="156" width="280" height="55" rx="5" fill="#1A3055" stroke="#2A4A6A" stroke-width="1"/>
      <text x="10" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B8FAE">I want to transition into data science</text>
      <text x="10" y="187" font-family="system-ui,sans-serif" font-size="10" fill="#6B8FAE">from a business background...</text>

      <!-- Submit button -->
      <rect x="0" y="225" width="280" height="40" rx="8" fill="#C89930"/>
      <text x="140" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0A2240">Submit Application →</text>
    </g>
  </g>

  <!-- Right: Process steps -->
  <g transform="translate(430, 50)">
    <text x="0" y="20" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">What happens next?</text>
    <rect x="0" y="30" width="100" height="3" rx="2" fill="#C89930"/>

    <!-- Step 1 -->
    <g transform="translate(0, 55)">
      <circle cx="22" cy="22" r="22" fill="#C89930"/>
      <text x="22" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0A2240">1</text>
      <text x="58" y="16" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Submit your form</text>
      <text x="58" y="32" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Takes less than 5 minutes</text>
      <line x1="22" y1="44" x2="22" y2="70" stroke="#1E3A5E" stroke-width="2" stroke-dasharray="4,3"/>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 135)">
      <circle cx="22" cy="22" r="22" fill="#112038" stroke="#C89930" stroke-width="2"/>
      <text x="22" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#C89930">2</text>
      <text x="58" y="16" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">We review &amp; email you</text>
      <text x="58" y="32" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Within 2 working days</text>
      <line x1="22" y1="44" x2="22" y2="70" stroke="#1E3A5E" stroke-width="2" stroke-dasharray="4,3"/>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 215)">
      <circle cx="22" cy="22" r="22" fill="#112038" stroke="#C89930" stroke-width="2"/>
      <text x="22" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#C89930">3</text>
      <text x="58" y="16" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Intro call &amp; enrolment</text>
      <text x="58" y="32" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Meet your cohort &amp; start</text>
      <line x1="22" y1="44" x2="22" y2="70" stroke="#1E3A5E" stroke-width="2" stroke-dasharray="4,3"/>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 295)">
      <circle cx="22" cy="22" r="22" fill="#112038" stroke="#C89930" stroke-width="2"/>
      <!-- Graduation cap -->
      <rect x="10" y="26" width="24" height="7" rx="2" fill="#C89930"/>
      <polygon points="22,14 34,22 22,28 10,22" fill="#E8B030"/>
      <text x="58" y="16" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Get qualified</text>
      <text x="58" y="32" font-family="system-ui,sans-serif" font-size="11" fill="#8DA3BE">Regulated qualification</text>
    </g>
  </g>

  <text x="400" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#C89930" letter-spacing="2">START YOUR APPLICATION TODAY</text>
</svg>
