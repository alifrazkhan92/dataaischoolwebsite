<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E2E5A"/>
      <stop offset="100%" style="stop-color:#0A2240"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>

  <!-- Round collaboration table -->
  <ellipse cx="200" cy="140" rx="120" ry="35" fill="#1A3055" stroke="#2A4A7A" stroke-width="1.5"/>
  <ellipse cx="200" cy="138" rx="115" ry="32" fill="#142840"/>

  <!-- Central screen/hub on table -->
  <rect x="168" y="118" width="64" height="44" rx="5" fill="#0D1E35" stroke="#C89930" stroke-width="1.5"/>
  <rect x="173" y="123" width="54" height="34" rx="3" fill="#1A3A6A"/>
  <!-- Mini chart on central screen -->
  <circle cx="200" cy="140" r="12" fill="none" stroke="#E8B030" stroke-width="2"/>
  <path d="M200,140 L200,128" stroke="#C89930" stroke-width="2"/>
  <path d="M200,140 L210,147" stroke="#C89930" stroke-width="2"/>
  <circle cx="200" cy="140" r="3" fill="#C89930"/>

  <!-- Student 1 - top -->
  <circle cx="200" cy="72" r="16" fill="#1A4A8A"/>
  <ellipse cx="200" cy="98" rx="22" ry="12" fill="#142A50"/>
  <circle cx="194" cy="70" r="2.5" fill="#6B8FAE"/>
  <circle cx="206" cy="70" r="2.5" fill="#6B8FAE"/>
  <path d="M196,79 Q200,83 204,79" fill="none" stroke="#6B8FAE" stroke-width="1.5"/>
  <!-- Laptop -->
  <rect x="178" y="108" width="44" height="26" rx="3" fill="#0D1E35" opacity="0.9"/>

  <!-- Student 2 - right -->
  <circle cx="326" cy="118" r="16" fill="#1A4A8A"/>
  <ellipse cx="326" cy="144" rx="22" ry="12" fill="#142A50"/>
  <circle cx="320" cy="116" r="2.5" fill="#6B8FAE"/>
  <circle cx="332" cy="116" r="2.5" fill="#6B8FAE"/>
  <!-- Tablet -->
  <rect x="280" y="128" width="36" height="28" rx="3" fill="#0D1E35" opacity="0.9"/>
  <rect x="284" y="132" width="28" height="20" rx="2" fill="#1A3A6A" opacity="0.8"/>

  <!-- Student 3 - bottom -->
  <circle cx="200" cy="190" r="16" fill="#C89930"/>
  <ellipse cx="200" cy="170" rx="22" ry="12" fill="#A8690A"/>
  <circle cx="194" cy="188" r="2.5" fill="#F5F0E8"/>
  <circle cx="206" cy="188" r="2.5" fill="#F5F0E8"/>
  <!-- Notebook -->
  <rect x="178" y="160" width="44" height="30" rx="3" fill="#F5F0E8" opacity="0.8" transform="rotate(180,200,175)"/>

  <!-- Student 4 - left -->
  <circle cx="74" cy="118" r="16" fill="#1A4A8A"/>
  <ellipse cx="74" cy="144" rx="22" ry="12" fill="#142A50"/>
  <circle cx="68" cy="116" r="2.5" fill="#6B8FAE"/>
  <circle cx="80" cy="116" r="2.5" fill="#6B8FAE"/>
  <!-- Laptop -->
  <rect x="84" y="128" width="36" height="28" rx="3" fill="#0D1E35" opacity="0.9"/>
  <rect x="88" y="132" width="28" height="20" rx="2" fill="#1A3A6A" opacity="0.8"/>

  <!-- Connection lines between students -->
  <g stroke="#C89930" stroke-width="1" stroke-dasharray="4,3" opacity="0.4">
    <line x1="200" y1="88" x2="200" y2="118"/>
    <line x1="310" y1="122" x2="232" y2="132"/>
    <line x1="90" y1="122" x2="168" y2="132"/>
    <line x1="200" y1="165" x2="200" y2="162"/>
  </g>

  <!-- Floating speech bubbles -->
  <rect x="230" y="60" width="55" height="28" rx="6" fill="#1A3055" stroke="#6B8FAE" stroke-width="1" opacity="0.8"/>
  <polygon points="240,88 248,88 244,96" fill="#1A3055" opacity="0.8"/>
  <rect x="236" y="68" width="43" height="4" rx="2" fill="#6B8FAE" opacity="0.6"/>
  <rect x="236" y="76" width="33" height="4" rx="2" fill="#6B8FAE" opacity="0.5"/>

  <text x="200" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#C89930" letter-spacing="2">COLLABORATIVE PROJECT WORK</text>
</svg>
