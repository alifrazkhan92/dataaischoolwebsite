<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="100%" style="stop-color:#0E3268"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B030"/>
      <stop offset="100%" style="stop-color:#C89930"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A4A8A"/>
      <stop offset="100%" style="stop-color:#0A2240"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#6B8FAE" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
  </g>

  <!-- London skyline silhouette at bottom -->
  <g fill="#0A2240" opacity="0.5">
    <!-- Big Ben -->
    <rect x="60" y="370" width="18" height="110"/>
    <rect x="55" y="365" width="28" height="8"/>
    <rect x="62" y="340" width="14" height="28"/>
    <polygon points="69,320 62,340 76,340"/>
    <!-- Building 1 -->
    <rect x="100" y="400" width="40" height="80"/>
    <rect x="105" y="395" width="8" height="8"/><rect x="118" y="395" width="8" height="8"/><rect x="131" y="395" width="8" height="8"/>
    <!-- Building 2 -->
    <rect x="150" y="380" width="30" height="100"/>
    <!-- Building 3 (tall) -->
    <rect x="190" y="350" width="25" height="130"/>
    <rect x="192" y="345" width="21" height="8"/>
    <!-- Building 4 -->
    <rect x="225" y="390" width="35" height="90"/>
    <!-- Shard-like -->
    <polygon points="270,310 280,480 260,480"/>
    <!-- More buildings -->
    <rect x="290" y="400" width="28" height="80"/>
    <rect x="328" y="370" width="22" height="110"/>
    <rect x="358" y="410" width="40" height="70"/>
    <rect x="406" y="385" width="30" height="95"/>
    <!-- Right side -->
    <rect x="640" y="395" width="35" height="85"/>
    <rect x="683" y="360" width="28" height="120"/>
    <rect x="719" y="400" width="40" height="80"/>
    <rect x="767" y="375" width="32" height="105"/>
    <rect x="807" y="395" width="25" height="85"/>
    <rect x="840" y="380" width="60" height="100"/>
  </g>

  <!-- Central laptop -->
  <g transform="translate(280, 130)">
    <!-- Laptop base/keyboard -->
    <rect x="0" y="220" width="340" height="20" rx="4" fill="#1A3055"/>
    <rect x="-20" y="238" width="380" height="8" rx="4" fill="#0E2545"/>
    <!-- Laptop screen bezel -->
    <rect x="20" y="0" width="300" height="220" rx="8" fill="#0D1E35"/>
    <!-- Screen -->
    <rect x="28" y="8" width="284" height="204" rx="4" fill="url(#screenGrad)"/>

    <!-- Chart bars on screen -->
    <g fill="url(#goldGrad)" opacity="0.9">
      <rect x="50" y="120" width="28" height="70"/>
      <rect x="90" y="90" width="28" height="100"/>
      <rect x="130" y="60" width="28" height="130"/>
      <rect x="170" y="100" width="28" height="90"/>
      <rect x="210" y="75" width="28" height="115"/>
    </g>
    <!-- Chart line -->
    <polyline points="64,120 104,90 144,60 184,100 224,75" fill="none" stroke="#E8B030" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dots on line -->
    <circle cx="64" cy="120" r="4" fill="#E8B030"/>
    <circle cx="104" cy="90" r="4" fill="#E8B030"/>
    <circle cx="144" cy="60" r="4" fill="#E8B030"/>
    <circle cx="184" cy="100" r="4" fill="#E8B030"/>
    <circle cx="224" cy="75" r="4" fill="#E8B030"/>
    <!-- Screen code text lines -->
    <rect x="40" y="24" width="80" height="5" rx="2" fill="#C89930" opacity="0.7"/>
    <rect x="40" y="34" width="120" height="4" rx="2" fill="#6B8FAE" opacity="0.5"/>
    <rect x="40" y="43" width="100" height="4" rx="2" fill="#6B8FAE" opacity="0.4"/>
    <!-- Axes -->
    <line x1="40" y1="200" x2="260" y2="200" stroke="#6B8FAE" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="50" x2="40" y2="200" stroke="#6B8FAE" stroke-width="1" opacity="0.5"/>
    <!-- Keyboard keys hint -->
    <rect x="120" y="225" width="100" height="8" rx="2" fill="#2A3A55" opacity="0.6"/>
  </g>

  <!-- Floating graduation cap (top left area) -->
  <g transform="translate(120, 80)" filter="url(#glow)">
    <rect x="0" y="30" width="80" height="12" rx="3" fill="#C89930"/>
    <polygon points="40,0 80,30 40,42 0,30" fill="url(#goldGrad)"/>
    <line x1="80" y1="30" x2="90" y2="55" stroke="#C89930" stroke-width="2.5"/>
    <circle cx="90" cy="58" r="5" fill="#C89930"/>
  </g>

  <!-- Floating open book (bottom left) -->
  <g transform="translate(80, 340)">
    <path d="M10,0 Q0,-5 0,0 L0,80 Q0,85 10,80 Q55,60 80,65 L80,0 Q55,-20 10,0Z" fill="#1A4A8A" opacity="0.9"/>
    <path d="M80,0 Q105,-20 150,0 L150,80 Q105,60 80,65 L80,0Z" fill="#0E3268" opacity="0.9"/>
    <line x1="80" y1="0" x2="80" y2="80" stroke="#6B8FAE" stroke-width="1" opacity="0.4"/>
    <!-- Book lines -->
    <line x1="15" y1="20" x2="72" y2="8" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
    <line x1="15" y1="30" x2="72" y2="20" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
    <line x1="15" y1="40" x2="72" y2="31" stroke="#6B8FAE" stroke-width="1.5" opacity="0.4"/>
    <line x1="88" y1="20" x2="140" y2="8" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
    <line x1="88" y1="30" x2="140" y2="20" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
    <!-- Gold bookmark -->
    <polygon points="60,0 68,0 68,25 64,20 60,25" fill="#C89930"/>
  </g>

  <!-- Floating neural network (right side) -->
  <g transform="translate(700, 100)" opacity="0.85">
    <!-- Nodes -->
    <circle cx="20" cy="60" r="10" fill="#1A4A8A" stroke="#C89930" stroke-width="2"/>
    <circle cx="20" cy="110" r="10" fill="#1A4A8A" stroke="#C89930" stroke-width="2"/>
    <circle cx="20" cy="160" r="10" fill="#1A4A8A" stroke="#C89930" stroke-width="2"/>
    <circle cx="85" cy="40" r="10" fill="#0E3268" stroke="#E8B030" stroke-width="2"/>
    <circle cx="85" cy="90" r="10" fill="#0E3268" stroke="#E8B030" stroke-width="2"/>
    <circle cx="85" cy="140" r="10" fill="#0E3268" stroke="#E8B030" stroke-width="2"/>
    <circle cx="85" cy="190" r="10" fill="#0E3268" stroke="#E8B030" stroke-width="2"/>
    <circle cx="150" cy="85" r="12" fill="#C89930"/>
    <circle cx="150" cy="145" r="12" fill="#C89930"/>
    <!-- Connections -->
    <g stroke="#6B8FAE" stroke-width="1" opacity="0.5">
      <line x1="30" y1="60" x2="75" y2="40"/><line x1="30" y1="60" x2="75" y2="90"/>
      <line x1="30" y1="60" x2="75" y2="140"/>
      <line x1="30" y1="110" x2="75" y2="40"/><line x1="30" y1="110" x2="75" y2="90"/>
      <line x1="30" y1="110" x2="75" y2="140"/><line x1="30" y1="110" x2="75" y2="190"/>
      <line x1="30" y1="160" x2="75" y2="90"/><line x1="30" y1="160" x2="75" y2="140"/>
      <line x1="30" y1="160" x2="75" y2="190"/>
      <line x1="95" y1="40" x2="138" y2="85"/><line x1="95" y1="90" x2="138" y2="85"/>
      <line x1="95" y1="140" x2="138" y2="85"/><line x1="95" y1="190" x2="138" y2="85"/>
      <line x1="95" y1="40" x2="138" y2="145"/><line x1="95" y1="90" x2="138" y2="145"/>
      <line x1="95" y1="140" x2="138" y2="145"/><line x1="95" y1="190" x2="138" y2="145"/>
    </g>
  </g>

  <!-- Floating certificate / scroll (top right) -->
  <g transform="translate(760, 70)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#1A3055" stroke="#C89930" stroke-width="1.5"/>
    <line x1="10" y1="15" x2="70" y2="15" stroke="#6B8FAE" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="25" x2="70" y2="25" stroke="#6B8FAE" stroke-width="1.5" opacity="0.5"/>
    <line x1="10" y1="35" x2="50" y2="35" stroke="#6B8FAE" stroke-width="1.5" opacity="0.4"/>
    <circle cx="40" cy="50" r="7" fill="none" stroke="#C89930" stroke-width="2"/>
    <line x1="36" y1="50" x2="39" y2="53" stroke="#C89930" stroke-width="1.5"/>
    <line x1="39" y1="53" x2="44" y2="46" stroke="#C89930" stroke-width="1.5"/>
  </g>

  <!-- Floating pie chart (left middle) -->
  <g transform="translate(60, 200)">
    <circle cx="35" cy="35" r="30" fill="#1A3055"/>
    <path d="M35,35 L35,5 A30,30 0 0,1 65,35 Z" fill="#C89930"/>
    <path d="M35,35 L65,35 A30,30 0 0,1 20,62 Z" fill="#E8B030" opacity="0.7"/>
    <path d="M35,35 L20,62 A30,30 0 0,1 5,20 Z" fill="#6B8FAE" opacity="0.6"/>
    <path d="M35,35 L5,20 A30,30 0 0,1 35,5 Z" fill="#2B6CB0" opacity="0.5"/>
  </g>

  <!-- Small floating stars / particles -->
  <g fill="#C89930" opacity="0.6">
    <circle cx="200" cy="50" r="2"/><circle cx="550" cy="80" r="2"/>
    <circle cx="650" cy="50" r="2"/><circle cx="750" cy="300" r="2"/>
    <circle cx="180" cy="280" r="2"/><circle cx="820" cy="280" r="2"/>
  </g>
  <g fill="#E8B030" opacity="0.35">
    <circle cx="480" cy="60" r="3"/><circle cx="680" cy="300" r="3"/>
    <circle cx="140" cy="180" r="3"/>
  </g>

  <!-- Bottom label band -->
  <rect x="0" y="470" width="900" height="30" fill="#0A2240" opacity="0.8"/>
  <text x="450" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#C89930" letter-spacing="3">THE DATA AND AI SCHOOL OF LONDON</text>
</svg>
