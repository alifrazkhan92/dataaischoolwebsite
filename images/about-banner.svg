<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2240"/>
      <stop offset="60%" style="stop-color:#0E3268"/>
      <stop offset="100%" style="stop-color:#0A2240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C89930"/>
      <stop offset="100%" style="stop-color:#E8B030"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#6B8FAE" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/><line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- London skyline silhouette -->
  <g fill="#091B32" opacity="0.6">
    <!-- Left side buildings -->
    <rect x="0" y="280" width="40" height="120"/>
    <rect x="48" y="260" width="30" height="140"/>
    <rect x="85" y="240" width="25" height="160"/>
    <rect x="115" y="270" width="35" height="130"/>
    <!-- Big Ben -->
    <rect x="158" y="200" width="22" height="200"/>
    <rect x="153" y="196" width="32" height="8"/>
    <rect x="161" y="165" width="16" height="34"/>
    <polygon points="169,145 161,165 177,165"/>
    <rect x="164" y="188" width="10" height="8" fill="#C89930" opacity="0.4"/>
    <!-- Tower Bridge -->
    <rect x="220" y="270" width="15" height="130"/>
    <rect x="265" y="270" width="15" height="130"/>
    <rect x="220" y="270" width="60" height="10" fill="#091B32"/>
    <rect x="222" y="252" width="11" height="22"/>
    <rect x="267" y="252" width="11" height="22"/>
    <line x1="228" y1="258" x2="272" y2="258" stroke="#091B32" stroke-width="3"/>
    <!-- More buildings -->
    <rect x="298" y="250" width="28" height="150"/>
    <rect x="332" y="230" width="22" height="170"/>
    <!-- The Gherkin-ish -->
    <ellipse cx="390" cy="220" rx="18" ry="80" fill="#091B32" opacity="0.6"/>
    <rect x="372" y="300" width="36" height="100"/>
    <!-- Shard -->
    <polygon points="440,150 455,400 425,400"/>
    <!-- More -->
    <rect x="468" y="265" width="30" height="135"/>
    <rect x="505" y="245" width="25" height="155"/>
    <rect x="540" y="275" width="35" height="125"/>
    <!-- Centre gap with featured building -->
    <rect x="585" y="220" width="30" height="180"/>
    <rect x="625" y="250" width="25" height="150"/>
    <rect x="658" y="235" width="28" height="165"/>
    <!-- Right side -->
    <rect x="694" y="260" width="32" height="140"/>
    <polygon points="730,190 745,400 715,400"/>
    <rect x="753" y="270" width="28" height="130"/>
    <rect x="788" y="245" width="35" height="155"/>
    <rect x="830" y="265" width="22" height="135"/>
    <rect x="860" y="280" width="40" height="120"/>
    <rect x="908" y="255" width="28" height="145"/>
    <rect x="944" y="240" width="30" height="160"/>
    <rect x="982" y="270" width="25" height="130"/>
    <rect x="1015" y="260" width="35" height="140"/>
    <rect x="1058" y="235" width="28" height="165"/>
    <rect x="1094" y="270" width="40" height="130"/>
    <rect x="1142" y="250" width="58" height="150"/>
  </g>

  <!-- Gold horizon line -->
  <rect x="0" y="375" width="1200" height="3" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Left content area: text block -->
  <rect x="80" y="80" width="4" height="180" rx="2" fill="#C89930"/>
  <text x="105" y="130" font-family="system-ui,sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">About Our School</text>
  <text x="105" y="168" font-family="system-ui,sans-serif" font-size="16" fill="#8DA3BE">London-based · NCFE Approved Centre</text>
  <rect x="105" y="190" width="320" height="2" fill="#C89930" opacity="0.4"/>
  <text x="105" y="218" font-family="system-ui,sans-serif" font-size="14" fill="#8DA3BE">Equipping the next generation of Data</text>
  <text x="105" y="238" font-family="system-ui,sans-serif" font-size="14" fill="#8DA3BE">and AI professionals since 2026.</text>

  <!-- Stats row -->
  <g transform="translate(105, 270)">
    <rect x="0" y="0" width="90" height="60" rx="8" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <text x="45" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#C89930">4</text>
    <text x="45" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Courses</text>

    <rect x="105" y="0" width="90" height="60" rx="8" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <text x="150" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#C89930">100%</text>
    <text x="150" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Online</text>

    <rect x="210" y="0" width="90" height="60" rx="8" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
    <text x="255" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#C89930">UK</text>
    <text x="255" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8DA3BE">Regulated</text>
  </g>

  <!-- Right side: graduation cap illustration -->
  <g transform="translate(800, 100)">
    <rect x="0" y="80" width="180" height="28" rx="6" fill="#1A3055" stroke="#C89930" stroke-width="2"/>
    <polygon points="90,0 180,80 90,108 0,80" fill="#C89930" opacity="0.9"/>
    <line x1="180" y1="80" x2="210" y2="150" stroke="#C89930" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="158" r="12" fill="#C89930"/>
    <!-- Cap shine -->
    <polygon points="90,10 160,68 90,90 20,68" fill="#E8B030" opacity="0.3"/>
  </g>

  <!-- Floating degree scroll right -->
  <g transform="translate(740, 240)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#112038" stroke="#C89930" stroke-width="1.5"/>
    <rect x="8" y="12" width="104" height="6" rx="2" fill="#E8B030" opacity="0.8"/>
    <rect x="8" y="24" width="104" height="4" rx="2" fill="#6B8FAE" opacity="0.4"/>
    <rect x="8" y="33" width="80" height="4" rx="2" fill="#6B8FAE" opacity="0.4"/>
    <rect x="8" y="42" width="90" height="4" rx="2" fill="#6B8FAE" opacity="0.4"/>
    <rect x="8" y="51" width="70" height="4" rx="2" fill="#6B8FAE" opacity="0.3"/>
    <circle cx="60" cy="74" r="12" fill="none" stroke="#C89930" stroke-width="2"/>
    <line x1="54" y1="74" x2="58" y2="78" stroke="#C89930" stroke-width="2"/>
    <line x1="58" y1="78" x2="66" y2="68" stroke="#C89930" stroke-width="2"/>
  </g>
</svg>
