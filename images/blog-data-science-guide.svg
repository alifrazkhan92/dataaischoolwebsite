<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360">
 <defs>
 <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#0A2240"/>
 <stop offset="100%" style="stop-color:#0E3268"/>
 </linearGradient>
 <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" style="stop-color:#C89930"/>
 <stop offset="100%" style="stop-color:#E8B030"/>
 </linearGradient>
 </defs>
 <rect width="740" height="360" fill="url(#bg)"/>
 <rect x="0" y="0" width="740" height="4" fill="url(#gold)"/>

 <!-- Left: Scatter plot / data insight visual -->
 <g transform="translate(40, 50)">
 <!-- Chart container -->
 <rect x="0" y="0" width="300" height="260" rx="10" fill="#0D1E35" stroke="#1E3A5E" stroke-width="1.5"/>
 <rect x="0" y="0" width="300" height="36" rx="10" fill="#112038"/>
 <rect x="0" y="18" width="300" height="18" fill="#112038"/>
 <text x="150" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#C89930">Salary vs Experience, UK Data Scientists</text>

 <!-- Axes -->
 <line x1="40" y1="220" x2="280" y2="220" stroke="#1E3A5E" stroke-width="1.5"/>
 <line x1="40" y1="50" x2="40" y2="220" stroke="#1E3A5E" stroke-width="1.5"/>

 <!-- Y axis labels -->
 <text x="35" y="55" text-anchor="end" font-family="monospace" font-size="9" fill="#6B8FAE">£120k</text>
 <text x="35" y="105" text-anchor="end" font-family="monospace" font-size="9" fill="#6B8FAE">£90k</text>
 <text x="35" y="155" text-anchor="end" font-family="monospace" font-size="9" fill="#6B8FAE">£60k</text>
 <text x="35" y="205" text-anchor="end" font-family="monospace" font-size="9" fill="#6B8FAE">£35k</text>

 <!-- X axis labels -->
 <text x="60" y="234" text-anchor="middle" font-family="monospace" font-size="9" fill="#6B8FAE">0yr</text>
 <text x="120" y="234" text-anchor="middle" font-family="monospace" font-size="9" fill="#6B8FAE">2yr</text>
 <text x="180" y="234" text-anchor="middle" font-family="monospace" font-size="9" fill="#6B8FAE">5yr</text>
 <text x="240" y="234" text-anchor="middle" font-family="monospace" font-size="9" fill="#6B8FAE">8yr+</text>

 <!-- Grid lines -->
 <g stroke="#1A3055" stroke-width="0.5" opacity="0.5">
 <line x1="40" y1="100" x2="280" y2="100"/>
 <line x1="40" y1="150" x2="280" y2="150"/>
 <line x1="40" y1="200" x2="280" y2="200"/>
 </g>

 <!-- Trend line -->
 <line x1="55" y1="205" x2="270" y2="60" stroke="#C89930" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>

 <!-- Scatter points, junior -->
 <g fill="#6B8FAE" opacity="0.7">
 <circle cx="58" cy="210" r="5"/><circle cx="65" cy="205" r="5"/>
 <circle cx="72" cy="200" r="5"/><circle cx="55" cy="215" r="5"/>
 </g>
 <!-- Mid level -->
 <g fill="#1A4A8A" opacity="0.9">
 <circle cx="115" cy="170" r="6"/><circle cx="125" cy="160" r="6"/>
 <circle cx="108" cy="175" r="6"/><circle cx="132" cy="155" r="6"/>
 </g>
 <!-- Senior - gold -->
 <g fill="#C89930" opacity="0.9">
 <circle cx="178" cy="120" r="7"/><circle cx="188" cy="110" r="7"/>
 <circle cx="170" cy="128" r="7"/><circle cx="195" cy="105" r="7"/>
 </g>
 <!-- Principal - bright gold -->
 <g fill="#E8B030">
 <circle cx="248" cy="72" r="8"/><circle cx="258" cy="65" r="8"/>
 <circle cx="240" cy="80" r="8"/>
 </g>

 <!-- Axis labels -->
 <text x="160" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">Years of experience</text>
 <text x="12" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE" transform="rotate(-90,12,140)">Annual salary</text>
 </g>

 <!-- Right: What data scientists do -->
 <g transform="translate(380, 50)">
 <text x="0" y="20" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">What data scientists do</text>
 <rect x="0" y="28" width="140" height="3" rx="2" fill="#C89930"/>

 <!-- Activity blocks -->
 <g transform="translate(0, 45)">
 <!-- Data collection bar -->
 <rect x="0" y="0" width="260" height="34" rx="5" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
 <rect x="0" y="0" width="182" height="34" rx="5" fill="#1A3A6A"/>
 <text x="8" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Data collection &amp; cleaning</text>
 <text x="8" y="27" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">70% of the job</text>
 <text x="248" y="22" text-anchor="end" font-family="monospace" font-size="10" fill="#C89930">70%</text>
 </g>
 <g transform="translate(0, 90)">
 <rect x="0" y="0" width="260" height="34" rx="5" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
 <rect x="0" y="0" width="78" height="34" rx="5" fill="#C89930"/>
 <text x="8" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#0A2240">Modelling &amp; ML</text>
 <text x="8" y="27" font-family="system-ui,sans-serif" font-size="9" fill="#0A2240">20% of the job</text>
 <text x="248" y="22" text-anchor="end" font-family="monospace" font-size="10" fill="#C89930">20%</text>
 </g>
 <g transform="translate(0, 135)">
 <rect x="0" y="0" width="260" height="34" rx="5" fill="#112038" stroke="#1E3A5E" stroke-width="1"/>
 <rect x="0" y="0" width="26" height="34" rx="5" fill="#1A4A8A"/>
 <text x="34" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Communication</text>
 <text x="34" y="27" font-family="system-ui,sans-serif" font-size="9" fill="#8DA3BE">10% of the job</text>
 <text x="248" y="22" text-anchor="end" font-family="monospace" font-size="10" fill="#C89930">10%</text>
 </g>

 <!-- Salary snapshot -->
 <g transform="translate(0, 190)">
 <rect x="0" y="0" width="310" height="70" rx="8" fill="#C89930"/>
 <text x="155" y="20" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#0A2240">UK Average Salaries</text>
 <text x="20" y="38" font-family="system-ui,sans-serif" font-size="10" fill="#0A2240">Junior: £35k-£50k</text>
 <text x="20" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#0A2240">Mid-level: £55k-£75k</text>
 <text x="175" y="38" font-family="system-ui,sans-serif" font-size="10" fill="#0A2240">Senior: £80k-£110k</text>
 <text x="175" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#0A2240">Lead: £110k-£150k+</text>
 </g>
 </g>

 <text x="370" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#C89930" letter-spacing="2">DATA SCIENCE, A PLAIN-ENGLISH GUIDE</text>
</svg>
