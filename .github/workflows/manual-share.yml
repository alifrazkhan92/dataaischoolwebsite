name: Manual Social Share

# Share any existing blog post to Facebook, Instagram and LinkedIn on demand.
# Actions → Manual Social Share → Run workflow
# Enter the blog filename, e.g.:  will-ai-replace-data-scientists-uk-2026.html

on:
  workflow_dispatch:
    inputs:
      blog_file:
        description: "Blog filename (e.g. will-ai-replace-data-scientists-uk-2026.html)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  share:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4

      - name: Validate blog file exists
        run: |
          FILE="blog/${{ github.event.inputs.blog_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::File not found: $FILE"
            echo "Available blog posts:"
            ls blog/*.html
            exit 1
          fi
          echo "File found: $FILE"

      - name: Share to Facebook
        continue-on-error: true
        env:
          NEW_FILES:            "blog/${{ github.event.inputs.blog_file }}"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:           ""
          LI_ACCESS_TOKEN:      ""
          LI_AUTHOR_URN:        ""
        run: |
          echo "Sharing to Facebook..."
          python scripts/social_share.py

      - name: Share to Instagram
        continue-on-error: true
        env:
          NEW_FILES:            "blog/${{ github.event.inputs.blog_file }}"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:           ""
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN:      ""
          LI_AUTHOR_URN:        ""
        run: |
          echo "Sharing to Instagram..."
          python scripts/social_share.py

      - name: Share to LinkedIn
        continue-on-error: true
        env:
          NEW_FILES:            "blog/${{ github.event.inputs.blog_file }}"
          FB_PAGE_ACCESS_TOKEN: ""
          FB_PAGE_ID:           ""
          IG_USER_ID:           ""
          LI_ACCESS_TOKEN:      ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:        ${{ secrets.LI_AUTHOR_URN }}
        run: |
          echo "Sharing to LinkedIn..."
          python scripts/social_share.py

      - name: Update homepage latest post
        env:
          NEW_FILES: "blog/${{ github.event.inputs.blog_file }}"
        run: python scripts/update_homepage_post.py

      - name: Commit homepage update
        run: |
          git config user.name  "DAIS Blog Bot"
          git config user.email "actions@dataaischool.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Homepage already up to date — nothing to commit."
          else
            git commit -m "chore: update homepage latest post [skip ci]"
            git push origin main
          fi
