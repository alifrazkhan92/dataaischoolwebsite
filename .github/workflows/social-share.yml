name: Share new blog posts to social media

# Fires whenever a commit to main touches the blog/ directory.
# Only NEW blog posts (git diff-filter=A) trigger sharing — edits to
# existing posts are ignored so the same article is never posted twice.

on:
  push:
    branches: [main]
    paths: ['blog/**.html']

jobs:
  share:
    runs-on: ubuntu-latest

    # contents: write needed to push the homepage latest-post update
    permissions:
      contents: write

    steps:
      - name: Checkout (2 commits so we can diff)
        # Pinned to SHA to prevent tag-hijacking supply chain attacks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Detect newly added blog posts
        id: detect
        run: |
          # --diff-filter=A  →  Added files only (not Modified/Renamed/Deleted)
          NEW=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'blog/*.html' | tr '\n' ' ')
          echo "new_files=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ]; then
            echo "New blog post(s) detected: $NEW"
          else
            echo "No new blog posts in this push — skipping social share."
          fi

      - name: Pre-flight secrets check
        if: steps.detect.outputs.new_files != ''
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN:      ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:        ${{ secrets.LI_AUTHOR_URN }}
        run: |
          WARN=0
          if [ -z "$FB_PAGE_ACCESS_TOKEN" ] || [ -z "$FB_PAGE_ID" ]; then
            echo "::warning::Facebook secrets missing — FB posts will be skipped. Set FB_PAGE_ACCESS_TOKEN and FB_PAGE_ID in repo secrets."
            WARN=$((WARN+1))
          fi
          if [ -z "$IG_USER_ID" ]; then
            echo "::warning::IG_USER_ID secret missing — Instagram posts will be skipped."
            WARN=$((WARN+1))
          fi
          if [ -z "$LI_ACCESS_TOKEN" ] || [ -z "$LI_AUTHOR_URN" ]; then
            echo "::warning::LinkedIn secrets missing — LinkedIn posts will be skipped. Set LI_ACCESS_TOKEN and LI_AUTHOR_URN in repo secrets."
            WARN=$((WARN+1))
          elif [[ "$LI_AUTHOR_URN" != urn:li:person:* && "$LI_AUTHOR_URN" != urn:li:organization:* ]]; then
            echo "::error::LI_AUTHOR_URN has wrong format: '$LI_AUTHOR_URN'"
            echo "  Must be: urn:li:organization:XXXXXXXX  (Page) or urn:li:person:XXXXXXXX (profile)"
            echo "  Common mistake: using 'urn:li:company:' — the correct prefix is 'urn:li:organization:'"
            exit 1
          fi
          if [ "$WARN" -eq 3 ]; then
            echo "::error::All social media secrets are missing. Nothing will be posted. Add secrets under Settings → Secrets → Actions."
            exit 1
          fi
          echo "Pre-flight check passed ($WARN platform(s) will be skipped due to missing secrets)."

      - name: Set up Python
        if: steps.detect.outputs.new_files != ''
        # Pinned to SHA to prevent tag-hijacking supply chain attacks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.detect.outputs.new_files != ''
        run: pip install requests beautifulsoup4

      - name: Wait for GitHub Pages to deploy
        if: steps.detect.outputs.new_files != ''
        env:
          NEW_FILES: ${{ steps.detect.outputs.new_files }}
        run: |
          # Extract the first new blog file and build its live URL
          FIRST_FILE=$(echo "$NEW_FILES" | tr ' ' '\n' | grep -v '^$' | head -1)
          FILENAME=$(basename "$FIRST_FILE")
          PAGE_URL="https://www.dataaischool.com/blog/${FILENAME}"
          echo "Waiting for GitHub Pages to serve: $PAGE_URL"

          MAX_WAIT=600   # 10 minutes
          INTERVAL=15
          ELAPSED=0

          until curl -sf --max-time 10 "$PAGE_URL" -o /dev/null; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Timed out after ${MAX_WAIT}s — page may not be live yet."
              exit 1
            fi
            echo "Not live yet (${ELAPSED}s elapsed). Retrying in ${INTERVAL}s…"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Page is live after ${ELAPSED}s. Proceeding to share."

      - name: Share to Facebook, Instagram and LinkedIn
        if: steps.detect.outputs.new_files != ''
        env:
          NEW_FILES:             ${{ steps.detect.outputs.new_files }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN:       ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:         ${{ secrets.LI_AUTHOR_URN }}
        run: python scripts/social_share.py

      - name: Update homepage latest post section
        if: steps.detect.outputs.new_files != ''
        env:
          NEW_FILES: ${{ steps.detect.outputs.new_files }}
        run: python scripts/update_homepage_post.py

      - name: Commit homepage update
        if: steps.detect.outputs.new_files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to homepage."
          else
            git commit -m "chore: update homepage with latest blog post [skip ci]"
            git push
          fi
