name: AI Engineering Series

# Runs every Saturday at 07:00 UTC (08:00 BST in summer, 07:00 GMT in winter).
# Generates the next episode in the AI Engineering: Zero to Master series:
#   - Writes a full tutorial blog post with Claude
#   - Creates an Imagen 3 hero image
#   - Produces a 15-minute narrated video with ElevenLabs + ffmpeg
#   - Uploads to YouTube and adds to the series playlist
#   - Shares on Facebook, Instagram and LinkedIn

on:
  schedule:
    - cron: "0 7 * * 6"   # Every Saturday 07:00 UTC (08:00 BST)

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate episode but do NOT commit, push, or share (for testing)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  ai-series-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            Pillow requests beautifulsoup4 anthropic \
            google-genai google-api-python-client google-auth

      - name: Generate AI series episode
        env:
          ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:                 ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY:             ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:            ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID:              ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:          ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:          ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_AI_SERIES_PLAYLIST_ID:  ${{ secrets.YOUTUBE_AI_SERIES_PLAYLIST_ID }}
          FB_PAGE_ACCESS_TOKEN:           ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:                     ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:                     ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN:                ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:                  ${{ secrets.LI_AUTHOR_URN }}
        run: python scripts/generate_ai_series.py

      - name: Detect new episode files
        id: detect
        run: |
          NEW=$(git status --porcelain | grep -E '(\?\?|M) (blog/ai-eng-ep|images/blog-)' | awk '{print $2}' | tr '\n' ' ')
          echo "new_files=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ]; then
            echo "new_episode=true" >> "$GITHUB_OUTPUT"
            echo "New episode files: $NEW"
          else
            echo "new_episode=false" >> "$GITHUB_OUTPUT"
            echo "No new episode files detected."
          fi

      - name: Commit and push episode
        if: steps.detect.outputs.new_episode == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "DAIS Series Bot"
          git config user.email "actions@dataaischool.com"
          git add blog/ images/ blog.html sitemap.xml
          git diff --cached --name-only
          git commit -m "feat: AI Engineering series episode $(date +%Y-%m-%d) [skip ci]"
          git push origin main

      - name: Sync to local drive
        if: steps.detect.outputs.new_episode == 'true' && github.event.inputs.dry_run != 'true'
        run: echo "Push complete. Sync /Users/alikhan/Documents/dataaischoolwebsite/ from main branch."

      - name: Summary
        run: |
          echo "### AI Engineering Series Summary - $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- New episode: **${{ steps.detect.outputs.new_episode }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Files: ${{ steps.detect.outputs.new_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
