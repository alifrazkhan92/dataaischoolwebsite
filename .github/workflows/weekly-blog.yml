name: Weekly Blog Post

# Runs every Monday at 08:00 UTC (09:00 BST / 10:00 during BST offset periods)
# The blog post is generated with AI, committed, and pushed.
# The existing social-share.yml workflow then detects the new blog/*.html file
# and automatically posts to Facebook, Instagram, and LinkedIn.

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday 08:00 UTC

  # Allow manual trigger from the GitHub Actions UI (useful for testing)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: generate content but do not commit or push"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet Pillow anthropic

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/generate_weekly_blog.py

      - name: Check for new files
        id: check_files
        run: |
          git status --porcelain
          if git status --porcelain | grep -q "blog/"; then
            echo "new_post=true" >> $GITHUB_OUTPUT
          else
            echo "new_post=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (if not dry run)
        if: steps.check_files.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "DAIS Blog Bot"
          git config user.email "actions@dataaischool.com"
          # Stage new blog HTML and image
          git add blog/*.html images/blog-*.png images/blog-*.jpg sitemap.xml blog/BLOG_TOPICS_USED.json robots.txt 2>/dev/null || true
          git diff --cached --name-only
          git commit -m "chore: weekly blog post $(date +%Y-%m-%d)"
          git push origin main

      - name: Summary
        run: |
          echo "### Weekly Blog Generator Summary" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "New post committed: ${{ steps.check_files.outputs.new_post }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The social-share workflow will now detect the new blog post and post to Facebook, Instagram, and LinkedIn automatically." >> $GITHUB_STEP_SUMMARY
