name: Weekly Blog Post

# Runs every Monday at 06:00 UTC (07:00 BST in summer, 06:00 GMT in winter).
#
# WHY social sharing is done INLINE here (not via social-share.yml):
# GitHub deliberately prevents workflows triggered by GITHUB_TOKEN from
# triggering other workflows. Pushing from this workflow would therefore
# never fire social-share.yml. Social sharing is run as steps here instead.

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 06:00 UTC (07:00 BST)

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate post but do NOT commit, push, or share (for testing)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet Pillow requests beautifulsoup4 google-genai

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_weekly_blog.py

      - name: Detect new blog files
        id: detect
        run: |
          # Find newly created blog HTML files
          NEW=$(git status --porcelain | grep '?? blog/' | grep '\.html' | awk '{print $2}' | tr '\n' ' ')
          echo "new_files=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ]; then
            echo "New blog post(s): $NEW"
            echo "new_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new blog post generated this run."
            echo "new_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.detect.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "DAIS Blog Bot"
          git config user.email "actions@dataaischool.com"
          git add blog/ blog.html sitemap.xml images/
          git diff --cached --name-only
          git commit -m "chore: weekly blog post $(date +%Y-%m-%d) [skip ci]"
          git push origin main

      # ── Social sharing (inline — cannot rely on social-share.yml being triggered) ──

      - name: Pre-flight secrets check
        if: steps.detect.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN:      ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:        ${{ secrets.LI_AUTHOR_URN }}
        run: |
          WARN=0
          if [ -z "$FB_PAGE_ACCESS_TOKEN" ] || [ -z "$FB_PAGE_ID" ]; then
            echo "::warning::Facebook secrets missing — FB posts will be skipped."
            WARN=$((WARN+1))
          fi
          if [ -z "$IG_USER_ID" ]; then
            echo "::warning::IG_USER_ID secret missing — Instagram posts will be skipped."
            WARN=$((WARN+1))
          fi
          if [ -z "$LI_ACCESS_TOKEN" ] || [ -z "$LI_AUTHOR_URN" ]; then
            echo "::warning::LinkedIn secrets missing — LinkedIn posts will be skipped."
            WARN=$((WARN+1))
          elif [[ "$LI_AUTHOR_URN" != urn:li:person:* && "$LI_AUTHOR_URN" != urn:li:organization:* ]]; then
            echo "::error::LI_AUTHOR_URN has wrong format: '$LI_AUTHOR_URN'"
            echo "  Must be: urn:li:organization:XXXXXXXX  (Page) or urn:li:person:XXXXXXXX (profile)"
            exit 1
          fi
          echo "Pre-flight check passed."

      - name: Wait for GitHub Pages to deploy
        if: steps.detect.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NEW_FILES: ${{ steps.detect.outputs.new_files }}
        run: |
          FIRST_FILE=$(echo "$NEW_FILES" | tr ' ' '\n' | grep -v '^$' | head -1)
          FILENAME=$(basename "$FIRST_FILE")
          PAGE_URL="https://www.dataaischool.com/blog/${FILENAME}"
          echo "Waiting for GitHub Pages to serve: $PAGE_URL"

          MAX_WAIT=600
          INTERVAL=15
          ELAPSED=0

          until curl -sf --max-time 10 "$PAGE_URL" -o /dev/null; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Timed out after ${MAX_WAIT}s — page may not be live yet."
              exit 1
            fi
            echo "Not live yet (${ELAPSED}s elapsed). Retrying in ${INTERVAL}s…"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Page is live after ${ELAPSED}s. Proceeding to share."

      - name: Share to Facebook, Instagram and LinkedIn
        if: steps.detect.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NEW_FILES:            ${{ steps.detect.outputs.new_files }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN:      ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:        ${{ secrets.LI_AUTHOR_URN }}
        run: python scripts/social_share.py

      - name: Update homepage latest post section
        if: steps.detect.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NEW_FILES: ${{ steps.detect.outputs.new_files }}
        run: python scripts/update_homepage_post.py

      - name: Commit homepage update
        if: steps.detect.outputs.new_post == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "DAIS Blog Bot"
          git config user.email "actions@dataaischool.com"
          git add index.html blog.html
          if git diff --staged --quiet; then
            echo "Homepage and blog listing already up to date."
          else
            git commit -m "chore: update homepage and blog listing [skip ci]"
            git push origin main
          fi

      - name: Summary
        run: |
          echo "### Weekly Blog Summary — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- New post generated: **${{ steps.detect.outputs.new_post }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Files: ${{ steps.detect.outputs.new_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
