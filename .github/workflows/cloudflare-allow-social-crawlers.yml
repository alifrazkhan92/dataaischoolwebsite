name: Allow social media crawlers in Cloudflare WAF

# Diagnoses whether social crawlers can access the site, then either:
# (a) Creates a Cloudflare WAF bypass rule if CLOUDFLARE_API_TOKEN is set, or
# (b) Reports exactly what needs to be done in the Cloudflare dashboard.
# Also force-refreshes the Facebook og: cache if FB_PAGE_ACCESS_TOKEN is set.

on:
  workflow_dispatch:

jobs:
  allow-social-crawlers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test crawler access to blog post
        id: test
        run: |
          URL="https://www.dataaischool.com/blog/will-ai-replace-data-scientists-uk-2026.html"

          FB_STATUS=$(curl -s -o /tmp/fb_body.html -w "%{http_code}" --max-time 15 \
            -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" \
            "$URL")
          LI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -A "LinkedInBot/1.0 (compatible; LinkedInBot/1.0; +http://www.linkedin.com/)" \
            "$URL")
          NORMAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")

          echo "fb_status=$FB_STATUS"   >> "$GITHUB_OUTPUT"
          echo "li_status=$LI_STATUS"   >> "$GITHUB_OUTPUT"
          echo "normal_status=$NORMAL_STATUS" >> "$GITHUB_OUTPUT"

          echo "=== HTTP status results ==="
          echo "Normal browser:        $NORMAL_STATUS"
          echo "facebookexternalhit:   $FB_STATUS"
          echo "LinkedInBot:           $LI_STATUS"

          # Extract og: tags if page loaded
          if [ "$FB_STATUS" = "200" ]; then
            echo ""
            echo "=== og: tags found ==="
            grep -oP 'property="og:[^"]*"\s+content="[^"]*"' /tmp/fb_body.html || echo "(none found)"
          fi

      - name: Apply Cloudflare WAF bypass rule (if API token available)
        id: waf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FB_STATUS: ${{ steps.test.outputs.fb_status }}
          LI_STATUS: ${{ steps.test.outputs.li_status }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "waf_done=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping WAF rule creation."
            exit 0
          fi

          if [ "$FB_STATUS" = "200" ] && [ "$LI_STATUS" = "200" ]; then
            echo "waf_done=skip" >> "$GITHUB_OUTPUT"
            echo "Both crawlers already get 200 — no WAF rule needed."
            exit 0
          fi

          echo "Crawlers are blocked. Creating WAF bypass rule..."

          # Get Zone ID
          ZONE_RESP=$(curl -sf "https://api.cloudflare.com/client/v4/zones?name=dataaischool.com" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          ZONE_ID=$(echo "$ZONE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])" 2>/dev/null)

          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not get Zone ID — check CLOUDFLARE_API_TOKEN has Zone.Firewall Rules read/write permission"
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"

          # Create filter
          FILTER=$(curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/filters" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{
              "expression": "(http.user_agent contains \"facebookexternalhit\") or (http.user_agent contains \"Facebot\") or (http.user_agent contains \"LinkedInBot\") or (http.user_agent contains \"Twitterbot\") or (http.user_agent contains \"WhatsApp\") or (http.user_agent contains \"Slackbot\")",
              "description": "Social media crawlers"
            }')
          FILTER_ID=$(echo "$FILTER" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])" 2>/dev/null)

          if [ -z "$FILTER_ID" ]; then
            echo "::error::Failed to create filter: $FILTER"
            exit 1
          fi

          # Create allow rule
          RULE=$(curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/firewall/rules" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "[{\"filter\":{\"id\":\"$FILTER_ID\"},\"action\":\"allow\",\"description\":\"Allow social crawlers for og:tag scraping\"}]")

          echo "$RULE" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if d.get('success'): print('WAF rule created:', d['result'][0]['id'])
          else: print('ERROR:', d.get('errors',[])); sys.exit(1)
          "
          echo "waf_done=true" >> "$GITHUB_OUTPUT"

      - name: Force Facebook re-scrape of blog post
        env:
          FB_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_STATUS: ${{ steps.test.outputs.fb_status }}
        run: |
          URL="https://www.dataaischool.com/blog/will-ai-replace-data-scientists-uk-2026.html"
          ENC_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$URL'))")

          # Wait for WAF rule to propagate if we just created it
          if [ "$FB_STATUS" != "200" ]; then
            echo "Waiting 20s for WAF rule to propagate before scraping..."
            sleep 20
          fi

          if [ -z "$FB_TOKEN" ]; then
            echo "::warning::FB_PAGE_ACCESS_TOKEN not set — cannot force Facebook cache refresh."
            echo "To refresh manually: https://developers.facebook.com/tools/debug/?q=$ENC_URL"
          else
            echo "Forcing Facebook to re-scrape the blog post..."
            RESP=$(curl -sf -X POST \
              "https://graph.facebook.com/?id=$ENC_URL&scrape=true&access_token=$FB_TOKEN" \
              2>&1 || true)
            echo "Response: $RESP"
          fi

      - name: Summary
        env:
          FB_STATUS: ${{ steps.test.outputs.fb_status }}
          LI_STATUS: ${{ steps.test.outputs.li_status }}
          NORMAL_STATUS: ${{ steps.test.outputs.normal_status }}
          WAF_DONE: ${{ steps.waf.outputs.waf_done }}
        run: |
          echo "### Social Crawler Diagnostic Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Crawler | HTTP Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          status_icon() { [ "$1" = "200" ] && echo "✅ OK" || echo "❌ $1 Blocked"; }

          echo "| Normal browser | $NORMAL_STATUS | $(status_icon $NORMAL_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| facebookexternalhit | $FB_STATUS | $(status_icon $FB_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| LinkedInBot | $LI_STATUS | $(status_icon $LI_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$WAF_DONE" = "false" ]; then
            echo "⚠️ **Action needed — CLOUDFLARE_API_TOKEN secret is not set.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To fix the og:image sharing issue, do ONE of the following:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Option A (quick — Cloudflare dashboard):**" >> $GITHUB_STEP_SUMMARY
            echo "1. Log into dash.cloudflare.com → dataaischool.com → Security → Bots" >> $GITHUB_STEP_SUMMARY
            echo "2. Turn **Bot Fight Mode OFF**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Option B (better — add API token as secret):**" >> $GITHUB_STEP_SUMMARY
            echo "1. dash.cloudflare.com → My Profile → API Tokens → Create Token" >> $GITHUB_STEP_SUMMARY
            echo "2. Use template: *Edit zone DNS* → add Zone.Firewall Rules permission" >> $GITHUB_STEP_SUMMARY
            echo "3. GitHub repo → Settings → Secrets → Actions → New: \`CLOUDFLARE_API_TOKEN\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Re-run this workflow — it will create the bypass rule automatically" >> $GITHUB_STEP_SUMMARY
          elif [ "$WAF_DONE" = "true" ]; then
            echo "✅ WAF bypass rule created. Social crawlers should now get og:image previews." >> $GITHUB_STEP_SUMMARY
          elif [ "$WAF_DONE" = "skip" ]; then
            echo "✅ Crawlers already have access. If previews still show no image, Facebook's cache needs refreshing:" >> $GITHUB_STEP_SUMMARY
            echo "Visit: https://developers.facebook.com/tools/debug/ → paste the blog URL → Scrape Again" >> $GITHUB_STEP_SUMMARY
          fi
